name: Type checking

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  steep:
    name: Steep (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
    env:
      BUNDLE_WITHOUT: "coverage development pcap"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bundle system dependencies
        run: sudo apt-get install -y --no-install-recommends libpcap-dev
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec ruby tools/dev/check_types.rb
      - name: Verify typing contracts and regression guards
        run: SPEC_HELPER_LOAD_METASPLOIT=false bundle exec rspec test/typing/contracts_spec.rb
      - name: Verify DCERPC wire behavior
        run: SPEC_HELPER_LOAD_METASPLOIT=false bundle exec rspec spec/lib/rex/proto/dcerpc/uuid_spec.rb spec/lib/rex/proto/dcerpc/packet_spec.rb
