services:
  db:
    extends: {file: ../wp_batch_desync_rce/services.yaml, service: db}
  app:
    extends: {file: ../wp_batch_desync_rce/services.yaml, service: app}
    environment:
      WORDPRESS_CORE_RELEASE: "7.0.2"
      WORDPRESS_TABLE_PREFIX: "wp_"
      LAB_PREFIX: ""
      LAB_PLAIN: "0"
      WP2SHELL_SINGLE_USER: "0"
      WP2SHELL_NO_POSTS: "0"
      LAB_PAGE_ONLY: "0"
      LAB_UPLOADS_DISABLED: "0"
    volumes:
    - ../../../tmp/module-target-wordpress-core-sources/7.0.2.tar.gz:/opt/module-target/core.tar.gz:ro
  reporting_db:
    extends: {file: ../wp_batch_desync_rce/services.yaml, service: reporting_db}
networks:
  default: {internal: true}
  public: {}
