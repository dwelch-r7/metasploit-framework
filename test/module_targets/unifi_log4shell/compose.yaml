services:
  target:
    build: {context: .}
    image: msf-module-target-unifi-6.5.53:fixture
    platform: linux/amd64
    init: true
    cpus: 0.6
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 192
    environment:
      JVM_MAX_HEAP_SIZE: 256M
      JVM_INIT_HEAP_SIZE: 64M
      JVM_MAX_THREAD_STACK_SIZE: 256k
      JVM_EXTRA_OPTS: >-
        -XX:+UseSerialGC -XX:ActiveProcessorCount=1
        -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m
        -XX:MaxDirectMemorySize=32m
        -javaagent:/opt/module-target/identity-agent.jar=/unifi/proofs/jvm-identity.jsonl
      RUNAS_UID0: 'true'
      UNIFI_STDOUT: 'true'
    ports: ["127.0.0.1::8443"]
    tmpfs:
      - /unifi:rw,size=512m,mode=1777
      - /var/run/unifi:rw,size=16m,mode=1777
      - /tmp:rw,size=32m,mode=1777
    healthcheck:
      test: [CMD-SHELL, "curl --max-time 3 -ksSf https://127.0.0.1:8443/status | grep -q server_version"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 3s
