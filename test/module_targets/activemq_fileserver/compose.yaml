{
  "services": {
    "affected": {
      "platform": "linux/amd64",
      "build": {
        "context": "../activemq_legacy",
        "args": {
          "ARCHIVE_URL": "https://archive.apache.org/dist/activemq/5.11.1/apache-activemq-5.11.1-bin.tar.gz",
          "ARCHIVE_SHA512": "ff0558702a5aa7192b427187ea1186c8290f26448a73a2b5443bf9a03155044bad78e9435465ad8b7bbdc2ab1a4bc66fa86a4d328eea8cb7df20fe24d5ca28ce"
        }
      },
      "ports": [
        "127.0.0.1::8161"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "--silent",
          "--fail",
          "--max-time",
          "2",
          "http://127.0.0.1:8161/"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 30
      },
      "command": [
        "sh",
        "-c",
        "unset JAVA_TOOL_OPTIONS; exec bin/activemq console"
      ]
    },
