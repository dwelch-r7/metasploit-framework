{
  "services": {
    "app": {
      "image": "linuxserver/pyload-ng:version-0.5.0b3.dev31@sha256:a0f9d450ca8cfa33e2aad0e8e035ecb6f68218885fce06ff6cf103c079d55caa",
      "platform": "linux/amd64",
      "cpus": 1,
      "mem_limit": "768m",
      "memswap_limit": "768m",
      "pids_limit": 128,
      "ports": [
        "127.0.0.1::8000",
        "127.0.0.1::9666"
      ],
      "environment": {
        "PUID": "1000",
        "PGID": "1000",
        "TZ": "Etc/UTC",
        "PYTHONUNBUFFERED": "1"
      },
      "networks": [
        "default",
        "public"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "-c",
          "import urllib.request;assert urllib.request.urlopen(\"http://127.0.0.1:8000/login\",timeout=3).status==200;assert b\"JDownloader\" in urllib.request.urlopen(\"http://127.0.0.1:9666/flash/\",timeout=3).read()"
        ],
        "interval": "3s",
        "timeout": "8s",
        "retries": 60
      },
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ],
      "ulimits": {
        "core": 0
      }
    },
    "reporting_db": {
      "platform": "linux/amd64",
      "extends": {
        "file": "../elasticsearch_memory/services.yaml",
        "service": "db"
      }
    }
  },
  "networks": {
    "default": {
      "internal": true
    },
    "public": {}
  }
}
