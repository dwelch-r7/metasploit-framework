---
x-runtime: &runtime
  build:
    context: ../wordpress
    args:
      WORDPRESS_IMAGE: wordpress:6.8.3-php8.3-apache@sha256:30bff39330d1693b0ce13d32fc9b7bb67193064f040b7d60d3494e136fa599d4
  cpus: 0.5
  mem_limit: 384m
  memswap_limit: 384m
  pids_limit: 128
  init: true
  networks: [default, public]
  volumes:
  - ../wordpress/seed.php:/opt/module-target/seed-base.php:ro
  - ./seed.php:/opt/module-target/seed.php:ro
  - ./control.php:/opt/module-target/control.php:ro
  - ./releases.json:/opt/module-target/releases.json:ro
  - ../wpdiscuz/no-mail.ini:/usr/local/etc/php/conf.d/module-target-depicter.ini:ro
  healthcheck:
    test: [CMD-SHELL, 'test -f /tmp/module-target-depicter-ready && curl --fail --silent http://127.0.0.1$${LAB_PREFIX}/wp-login.php >/dev/null']
    interval: 3s
    timeout: 5s
    retries: 40
services:
  db:
    extends: {file: ../wordpress/compose.yaml, service: db}
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    init: true
  root:
    extends: {file: ../wordpress/compose.yaml, service: root}
    <<: *runtime
  prefix:
    extends: {file: ../wordpress/compose.yaml, service: prefix}
    <<: *runtime
  reporting_db:
    extends: {file: ../piwigo/services.yaml, service: reporting_db}
    memswap_limit: 256m
  unrelated:
    extends: {file: ../http/compose.yaml, service: apache}
    networks: [default, public]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    init: true
