services:
  linux:
    platform: linux/amd64
    build:
      context: .
      args:
        SUDO_VERSION: 1.9.16p2
    user: '1001:1001'
    init: true
    read_only: true
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=4m,mode=755
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes: ['.:/opt/module-target-sudo:ro']
