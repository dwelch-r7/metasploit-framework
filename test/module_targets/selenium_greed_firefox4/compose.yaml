{
  "services": {
    "target": {
      "platform": "linux/amd64",
      "init": true,
      "cpus": 0.5,
      "mem_limit": "768m",
      "memswap_limit": "768m",
      "pids_limit": 512,
      "shm_size": "128m",
      "environment": {
        "MOZ_HEADLESS": "1",
        "SE_BROWSER_ARGS_HEADLESS": "--headless=new",
        "START_XVFB": "false",
        "SE_START_XVFB": "false",
        "SE_START_VNC": "false",
        "SE_START_NO_VNC": "false",
        "SE_ENABLE_TRACING": "false",
        "SE_NODE_MAX_SESSIONS": "1",
        "NODE_MAX_SESSION": "1",
        "SE_SESSION_REQUEST_TIMEOUT": "60",
        "SE_SESSION_RETRY_INTERVAL": "1",
        "SE_JAVA_OPTS": "-Xms32m -Xmx192m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC",
        "JAVA_OPTS": "-Xms32m -Xmx192m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC"
      },
      "ports": [
        {
          "target": 4444,
          "host_ip": "127.0.0.1"
        }
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/4444"
        ],
        "interval": "2s",
        "timeout": "3s",
        "start_period": "5s",
        "retries": 50
      },
      "image": "selenium/standalone-firefox:4.27.0@sha256:b1292054ce909ccc474a6c59a475039aeb4adf77c1d77ab5a160185fa562948d"
    }
  }
}
