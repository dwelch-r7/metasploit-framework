services:
  db:
    extends: {file: ../wp2shell/services.yaml, service: db}
  app:
    extends: {file: ../wp2shell/services.yaml, service: app}
    environment:
      WORDPRESS_CORE_RELEASE: "6.9.4"
      WORDPRESS_TABLE_PREFIX: wp_
      LAB_PREFIX: ""
    volumes:
    - ../../../tmp/module-target-wordpress-core-sources/6.9.4.tar.gz:/opt/module-target/core.tar.gz:ro
  reporting_db:
    extends: {file: ../wp2shell/services.yaml, service: reporting_db}
networks:
  default: {internal: true}
  public: {}
