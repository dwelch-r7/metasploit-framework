services:
  target:
    build:
      context: .
      args:
        OLLAMA_IMAGE: ollama/ollama@sha256:4b11fdc55cec0a227f3f3ba9b8910940f892f98252141c97ed3bc4b45507d08d
    platform: linux/amd64
    init: true
    cpus: 1
    mem_limit: 1024m
    memswap_limit: 1024m
    pids_limit: 128
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_LLM_LIBRARY: cpu
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      CUDA_VISIBLE_DEVICES: -1
      OMP_NUM_THREADS: 1
      GOMAXPROCS: 1
    ports: ["127.0.0.1::11434", "127.0.0.1::11435"]
    # A helper exec could consume /etc/ld.so.preload before /api/chat does.
    healthcheck: {disable: true}
