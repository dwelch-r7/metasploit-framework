ServerName module-target-flink
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
ProxyRequests Off
AllowEncodedSlashes NoDecode
ProxyPass /flink/ http://vulnerable:8081/ nocanon
ProxyPassReverse /flink/ http://vulnerable:8081/
<Location /flink/>
    AuthType Basic
    AuthName "Module target Flink"
    AuthUserFile /tmp/module-target.htpasswd
    Require valid-user
</Location>
