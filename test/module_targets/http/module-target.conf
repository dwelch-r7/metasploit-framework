ServerName module-target.local
ServerTokens Full
TraceEnable On
Redirect /redirect /final.html
<Directory "/usr/local/apache2/htdocs/listing">
    Options +Indexes
</Directory>
<Directory "/usr/local/apache2/htdocs/protected">
    AuthType Basic
    AuthName "Module target tests"
    AuthUserFile "/usr/local/apache2/conf/module-target.htpasswd"
    Require valid-user
</Directory>
