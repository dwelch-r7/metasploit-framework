# Real recipient routing/verification; remote test messages are discarded locally.
ALLOW_RELAY = RELAY_VALUE
ENABLE_VRFY = VRFY_VALUE
CATCHALL = CATCHALL_VALUE

primary_hostname = smtp.module-target.test
domainlist local_domains = @ : localhost : module-target.test
local_interfaces = 0.0.0.0
daemon_smtp_ports = 25
recipient_unqualified_hosts = *
smtp_banner = $primary_hostname ESMTP Exim $version_number
host_lookup =
rfc1413_query_timeout = 0s
smtp_accept_max = 100
smtp_receive_timeout = 10s
message_size_limit = 1M
log_file_path = /var/log/exim4/%slog
acl_smtp_rcpt = check_recipient
acl_smtp_vrfy = check_vrfy
acl_smtp_expn = deny_all

begin acl
check_recipient:
  accept domains = +local_domains
         verify = recipient
  accept condition = ALLOW_RELAY
         domains = ! +local_domains
  deny message = Relaying denied in module target

check_vrfy:
  accept condition = ENABLE_VRFY
  deny message = Verification disabled in module target

deny_all:
  deny message = Expansion disabled in module target

begin routers
local_accounts:
  driver = accept
  domains = +local_domains
  check_local_user
  transport = local_sink

local_catchall:
  driver = redirect
  domains = +local_domains
  condition = CATCHALL
  data = :blackhole:

remote_sink:
  driver = redirect
  domains = ! +local_domains
  condition = ALLOW_RELAY
  data = :blackhole:

begin transports
local_sink:
  driver = appendfile
  file = /var/spool/exim4/module-target-mail/capture-message
  current_directory = /var/spool/exim4/module-target-mail
  user = Debian-exim
  group = Debian-exim
  mode = 0600

begin retry
* * F,1m,1s

begin rewrite
begin authenticators

capture_plain:
  driver = plaintext
  public_name = PLAIN
  server_prompts = :
  server_condition = ${if and{{eq{$auth2}{capture_user}}{eq{$auth3}{${base64d:IG1vZHVsZS10YXJnZXQ6IGNhcHR1cmUgInF1b3RlZCIgXCB0YWlsIA==}}}}{yes}{no}}
  server_set_id = $auth2
capture_login:
  driver = plaintext
  public_name = LOGIN
  server_prompts = Username:: : Password::
  server_condition = ${if and{{eq{$auth1}{capture_user}}{eq{$auth2}{${base64d:IG1vZHVsZS10YXJnZXQ6IGNhcHR1cmUgInF1b3RlZCIgXCB0YWlsIA==}}}}{yes}{no}}
  server_set_id = $auth1
capture_cram:
  driver = cram_md5
  public_name = CRAM-MD5
  server_secret = ${if eq{$auth1}{capture_user}{${base64d:IG1vZHVsZS10YXJnZXQ6IGNhcHR1cmUgInF1b3RlZCIgXCB0YWlsIA==}}fail}
  server_set_id = $auth1
