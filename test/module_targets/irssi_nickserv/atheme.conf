// Derived from the matching 7.2.12 distribution example. Runtime unverified.
loadmodule "modules/protocol/ngircd";
loadmodule "modules/backend/opensex";
loadmodule "modules/crypto/posix";
loadmodule "modules/nickserv/main";
loadmodule "modules/nickserv/register";
loadmodule "modules/nickserv/identify";
loadmodule "modules/nickserv/status";
loadmodule "modules/nickserv/info";
loadmodule "modules/nickserv/logout";
loadmodule "modules/nickserv/drop";

serverinfo {
    name = "services.module.test";
    desc = "Module target genuine Atheme services";
    numeric = "00A";
    recontime = 2;
    netname = "Module target";
    adminname = "Lab operator";
    adminemail = "operator@example.test";
    maxlogins = 5;
    maxusers = 5;
    auth = none;
    casemapping = rfc1459;
    loglevel = { error; info; commands; register; network; };
};

uplink "irc.module.test" {
    host = "127.0.0.1";
    password = "module-target-link-password";
    port = 6667;
};

nickserv {
    nick = "NickServ";
    user = "NickServ";
    host = "services.module.test";
    real = "Nickname Services";
    maxnicks = 5;
    expire = 0;
};

general {
    flood_msgs = 0;
};
