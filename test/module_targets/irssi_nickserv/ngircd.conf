[Global]
Name = irc.module.test
Info = Module target NickServ prerequisite
Listen = 0.0.0.0
Ports = 6667
PidFile = /run/module-target-ngircd/server.pid
ServerUID = 65534
ServerGID = 65534

[Options]
DNS = no
Ident = no
PAM = no

[Limits]
MaxConnectionsIP = 20
MaxPenaltyTime = 0

[Server]
Name = services.module.test
Host = 127.0.0.1
# Matching 26.1 source maps these names differently from its sample comments.
# A common lab link password avoids relying on that direction naming.
MyPassword = module-target-link-password
PeerPassword = module-target-link-password
Passive = yes
ServiceMask = *Serv,Global
