use chroot = no
reverse lookup = no
forward lookup = no
motd file = /opt/motd.txt
log file = /dev/stdout
pid file = /tmp/rsyncd.pid

[public]
path = /srv/share
comment = open share
read only = yes

[locked]
path = /srv/share
comment = protected share
read only = yes
auth users = labuser
secrets file = /etc/rsyncd.secrets

[blank]
path = /srv/share
read only = yes

[hidden]
path = /srv/share
comment = unlisted share
read only = yes
list = no
