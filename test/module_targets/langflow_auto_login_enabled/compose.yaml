{
  "services": {
    "target": {
      "extends": {
        "file": "../langflow/compose.yaml",
        "service": "target"
      },
      "environment": {
        "LANGFLOW_AUTO_LOGIN": "true"
      },
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ],
      "networks": [
        "default",
        "public"
      ]
    }
  },
  "networks": {
    "default": {
      "internal": true
    },
    "public": {}
  }
}
