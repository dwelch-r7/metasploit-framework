services:
  database:
    image: mariadb@sha256:494865c2bac2be3868d9c31eb3c56afdc5639a5f56cbebed4084124b0616cd9e
    platform: linux/amd64
    init: true
    cpus: 0.3
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 96
    environment:
      MYSQL_ROOT_PASSWORD: module-target-dolibarr-root-password
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: module_app
      MYSQL_PASSWORD: module-target-dolibarr-db-password
    command: [--innodb-buffer-pool-size=64M, --innodb-log-file-size=8M, --innodb-flush-log-at-trx-commit=2, --skip-log-bin, --skip-name-resolve, --performance-schema=OFF, --max-connections=16, --aria-pagecache-buffer-size=16M, --key-buffer-size=8M, --query-cache-size=0, --tmp-table-size=8M, --max-heap-table-size=8M, --thread-cache-size=4]
    tmpfs: ['/var/lib/mysql:rw,size=256m', '/tmp:rw,size=32m']
    healthcheck:
      test: [CMD, mysql, --host=127.0.0.1, --user=module_app, --password=module-target-dolibarr-db-password, --database=dolibarr, --batch, --skip-column-names, --execute=SELECT 1]
      interval: 2s
      timeout: 5s
      retries: 60
  target:
    image: php:5.6.40-apache@sha256:0a40fd273961b99d8afe69a61a68c73c04bc0caa9de384d3b2dd9e7986eec86d
    platform: linux/amd64
    init: true
    read_only: true
    user: '1000:1000'
    cpus: 0.7
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 96
    entrypoint: [/bin/sh, /lab/start.sh]
    environment:
      DOLIBARR_PREFIX: ''
      DOLIBARR_LOOKUP_ENABLE: 'false'
    volumes:
    - '${MODULE_TARGET_ROOT}/test/module_targets/dolibarr:/lab:ro'
    - '${MODULE_TARGET_ROOT}/tmp/module-target-dolibarr-runtime/php-5.6.40:/runtime:ro'
    tmpfs: ['/tmp:rw,size=64m,mode=1777', '/opt/dolibarr/htdocs/conf:rw,size=1m,uid=1000,gid=1000,mode=700']
    ports: ['127.0.0.1::8080']
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/sh, /lab/start.sh, health]
      interval: 3s
      timeout: 5s
      retries: 60
