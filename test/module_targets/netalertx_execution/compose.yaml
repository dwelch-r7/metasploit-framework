services:
  target:
    image: msf-module-target-netalertx-execution-24.9.12:fixture
    platform: linux/amd64
    build:
      context: .
    init: false
    cpus: 0.4
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 96
    environment:
      WEB_PROTECTION: 'true'
      PORT: '20211'
      LISTEN_ADDR: 0.0.0.0
      HTTP_PROXY: http://127.0.0.1:9
      HTTPS_PROXY: http://127.0.0.1:9
      NO_PROXY: localhost,127.0.0.1,target,framework
    volumes:
      - ../netalertx_file_read/bootstrap.py:/opt/module-target-netalertx/bootstrap.py:ro
    tmpfs:
      - /app/config:rw,size=8m,mode=0755
      - /app/db:rw,size=24m,mode=0755
      - /app/front/log:rw,size=24m,mode=0755
      - /app/front/api:rw,size=24m,mode=0755
      - /tmp:rw,size=24m,mode=1777
      - /run:rw,exec,size=12m,mode=0755
      - /var/lib/php83/sessions:rw,size=4m,mode=0770
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS -o /dev/null http://127.0.0.1:20211/index.php && curl -fsS http://127.0.0.1:20211/api/table_settings.json | grep -Fq "DBCLNP_CMD"']
      interval: 2s
      timeout: 3s
      retries: 45
networks:
  default:
    internal: true
