services:
  target:
    platform: linux/amd64
    cpus: 0.25
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    environment:
      FORGEJO__security__INSTALL_LOCK: 'true'
      FORGEJO__security__PASSWORD_HASH_ALGO: 'pbkdf2$$50000$$50'
      FORGEJO__service__DISABLE_REGISTRATION: 'true'
      FORGEJO__server__DISABLE_SSH: 'true'
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://forgejo-target.invalid:3000/
      FORGEJO__server__HTTP_PORT: '3000'
      FORGEJO__log__MODE: console
      GOMAXPROCS: '2'
      GOMEMLIMIT: 160MiB
    volumes:
      - data:/data
      - ./files:/opt/module-target-files:ro
    ports: ["127.0.0.1::3000"]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:3000/api/v1/version | grep -Fq "\"version\":\"$$FORGEJO_EXPECTED_VERSION+gitea-"']
      interval: 2s
      timeout: 3s
      retries: 45
  reporting_db:
    extends: {file: ../gopher/compose.yaml, service: reporting_db}
  framework:
    cpus: 1
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
volumes:
  data: {}
