ServerName module-target-spark
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
ProxyRequests Off
ProxyPass /spark-ui/ http://affected:8080/
ProxyPassReverse /spark-ui/ http://affected:8080/
ProxyPass /spark-rest/ http://affected:6066/
ProxyPassReverse /spark-rest/ http://affected:6066/
<LocationMatch "^/spark-(ui|rest)/">
    AuthType Basic
    AuthName "Module target Spark"
    AuthUserFile /tmp/module-target.htpasswd
    Require valid-user
</LocationMatch>
