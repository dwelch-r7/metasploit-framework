services:
  target:
    image: vulhub/laravel@sha256:afd50843b9b5dd42418e4abbb2dc0607ff80aa6a68a4722dc4832563c77a7ad5
    platform: linux/amd64
    init: true
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    command: [sh, /opt/module-target-start.sh]
    volumes:
      - ./start.sh:/opt/module-target-start.sh:ro
      - ./native.php:/opt/module-target-native.php:ro
      - ./vendor.json:/opt/module-target-vendor.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1::80"]
    healthcheck:
      test: [CMD, php, -r, "$$headers=@get_headers('http://127.0.0.1/');exit(is_array($$headers)&&strpos($$headers[0],'200')!==false?0:1);"]
      interval: 2s
      timeout: 4s
      retries: 25
