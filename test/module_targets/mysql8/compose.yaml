services:
  mysql:
    image: mysql:8.0.36@sha256:a532724022429812ec797c285c1b540a644c15e248579c6bfdf12a8fbaab4964
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
    ports: ["127.0.0.1::3306"]
    healthcheck:
      test: [CMD-SHELL, "mysql --host=127.0.0.1 --user=root --password=password --batch --skip-column-names --execute='SELECT CURRENT_USER()' | grep -q '^root@'"]
      interval: 1s
      timeout: 3s
      retries: 90
