{
  "services": {
    "target": {
      "image": "metasploit-module-target-invoiceshelf:1.3.0",
      "build": {
        "context": "../invoiceshelf"
      },
      "platform": "linux/amd64",
      "init": true,
      "cpus": 1,
      "mem_limit": "768m",
      "memswap_limit": "768m",
      "pids_limit": 128,
      "environment": {
        "APP_NAME": "Laravel",
        "APP_ENV": "production",
        "APP_DEBUG": "false",
        "APP_URL": "http://127.0.0.1:8080",
        "APP_KEY": "base64:kgk/4DW1vEVy7aEvet5FPp5un6PIGe/so8H0mvoUtW0=",
        "DB_CONNECTION": "sqlite",
        "DB_DATABASE": "/opt/InvoiceShelf/storage/module-target.sqlite",
        "CACHE_DRIVER": "file",
        "QUEUE_DRIVER": "sync",
        "SESSION_DRIVER": "cookie",
        "SESSION_DOMAIN": "127.0.0.1",
        "SANCTUM_STATEFUL_DOMAINS": "127.0.0.1:8080",
        "PHP_CLI_SERVER_WORKERS": "2"
      },
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ],
      "volumes": [
        "../laravel/native_gadget.php:/opt/module-target-laravel-gadget.php:ro",
        "../invoiceshelf/native.php:/opt/module-target-native.php:ro",
        "../invoiceshelf/vendor.json:/opt/module-target-vendor.json:ro"
      ],
      "ports": [
        "127.0.0.1::8080"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "php",
          "-r",
          "$$json=json_decode(@file_get_contents('http://127.0.0.1:8080/api/v1/app/version'),true);exit(is_array($$json)&&isset($$json['version'])?0:1);"
        ],
        "interval": "2s",
        "timeout": "5s",
        "retries": 60
      }
    }
  }
}
