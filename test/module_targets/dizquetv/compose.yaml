services:
  target:
    image: vexorian/dizquetv@sha256:f93b5ba851fcd9ce120588abe3108bac30afd63921178870f646ed1258b64f35
    platform: linux/amd64
    init: true
    cpus: 0.7
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 96
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./health.pl:/opt/module-target-dizquetv-health.pl:ro"]
    ports: ["127.0.0.1::8000"]
    healthcheck:
      test: [CMD, perl, /opt/module-target-dizquetv-health.pl]
      interval: 3s
      timeout: 5s
      retries: 40
