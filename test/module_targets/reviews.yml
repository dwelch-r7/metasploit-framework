    reason: >-
      Three check-only examples pass after independent installation/PHP/API
      gates. The original check changed ten option names, including client
      permissions, footer/language settings, an encoded title and added rows;
      refused-port checking also made extra cleanup requests and raised a
      failure. Only the owner source changes between original 3/2 and final
      3/0 functional inputs. Query-only branding selection and minimal POST
      fields preserve all 134 rows; decoded title restoration verifies, and
      standalone checks avoid exploit cleanup. Twenty-seven focused owner
      regressions pass, including whitespace and nullable/ambiguous responses.
      Native registration, login, multipart PHP denial/approval, UID1000 web
      execution, self-unlink and portal-row cleanup pass separately. Actual
      owning PHP command paths pass in the separate RCE profile, while default
      sessions and other releases remain pending. Four native observer
      assumptions and a cross-client cookie export fault are retained separately.
      Normal unauthenticated option writes return HTTP 500 after persistence; a
      separate temporary DEBUG diagnostic identifies the vendor undefined
      CURRENT_USER_ID error, with original configuration/options restored.
      The latest set has 328 current inputs and 222 zero cgroup captures.
      Database memory.events max counter is 46 before/after module execution, with zero OOM or
      PID-limit events and no counter increase. All 612 recorded Docker objects
      are absent, including two unused agent-startup helpers. Only two capped
      services run: application 384 MiB/0.7 CPU and database 256 MiB/0.3 CPU. One
      inherited default-PAYLOAD lint/tidy warning remains. See
      VERIFICATION-20261121-projectsend.md; registration is not full-owner coverage.
      The command profile has 3 examples/1 failure/0 pending in 77.43 seconds:
      native stock PHP and real registration/upload/execute/delete controls pass,
      as do two original php/exec commands with exact UID1000 proof, AutoCheck
      on/off and same-selection repeat. Portal and physical upload inventories
      recover; existing user identity/role/activity/email fields preserve. Six option names change or are added
      after both executions, with 136 rows versus 134 initially. Two created
      active clients remain. This is a confirmed preservation defect, retained
      before explicit fixture recovery; no production source changes here.
      An earlier 3/1 native-gated frame matches the defect; an internal-network
      unpublished-port setup failure invokes no module. Loopback SMTP settings
      contain registration mail. Final counters remain unchanged, including
      database memory.max 46. All nine new Docker objects are absent and both
      contexts empty. The current combined input set is 337, while the prior
      110 fully passing cases/32 profiles remain separately qualified. See
      VERIFICATION-20261121-projectsend-rce.md.
      The default-session normal frame has 4/1/2 and no owning invocation:
      native installation/callback/reporting pass, but stock CLI staged PHP
      bootstrap fails before web/owner gates. Debug logging permits two used
      and closed native CLI/web sessions, with exact physical UID1000 proof,
      PID, callback inode and original reporting-row closure; these do not
      qualify the normal path. Original payload functions accept a whole
      72-byte TCP packet but retire and close after its 32-byte header while
      the peer remains open. This confirms a dependency framing defect;
      the original failing live wire was not captured, so exact bootstrap
      causality remains unproven. The installed 2.0.257 payload manifest passes.
      One context-restoration harness fault is fixed and separately retained.
      No production code or shared gem is patched. See
      VERIFICATION-20261121-projectsend-sessions.md.
      Opt-in source comparisons retain the normal installed-bundle failure.
      The maintained candidate frame has 4/2/0 with three used/closed sessions;
      an earlier private candidate has four sessions and the six-option
      preservation failure. The second final owner generates an underscore
      username rejected by the original backend, yet prints creation success.
      A native same-fields dotted-username control proves account persistence
      and genuine login; a post-persistence HTTP 500 remains unexplained.
      Nine source-variant sessions do not add ordinary qualification totals.
      A two-line harness correction observes effective target_index without
      forcing the target or payload. No production module or shared gem changes.
      See VERIFICATION-20261121-php-source-consumer.md; failures stay enabled.
