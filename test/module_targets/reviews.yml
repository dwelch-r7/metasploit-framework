# Individual source-reviewed target requirements; these are not blanket exclusions.
---
modules:
  exploit/linux/local/docker_cgroup_escape:
    source_sha256: 79da55cad312aa93a357f70a47eab3fe0145933b7dbba8482b4e4b10d6e6c747
    disposition: separate_kernel_target
    reason: The exploit mounts cgroup v1, writes notify_on_release and release_agent,
      resolves the actual host overlay upperdir, and asks the host kernel to execute
      its payload there. An ordinary service image cannot supply the affected host
      kernel or establish a host-root escape. Qualification requires a disposable
      VM with the matching kernel, cgroup setup and nested container engine, rather
      than changing the shared Docker host.
  exploit/linux/local/docker_privileged_container_escape:
    source_sha256: dadc76c8e9f6f2db484083c2271c4ac38265a105b1eba98d462cf153e18baa2d
    disposition: separate_host_target
    reason: The main function writes a cgroup release_agent and executes either
      docker cp or a search of the host overlay filesystem to obtain host root.
      A service container with invented host paths would not verify that escape.
      Use a disposable VM with its own privileged nested container and compatible
      cgroup v1 host setup; the shared Docker engine is not an isolated target.
  exploit/linux/local/cve_2022_0847_dirtypipe:
    source_sha256: fcd75cb71f8873db2231b89880caeeed83668e2fa9c558982987b5a75f8332e9
    disposition: separate_kernel_target
    reason: The check reads the running kernel and the exploit modifies SUID file
      pages through the kernel bug. A service image cannot supply its own vulnerable
      kernel; qualification needs a disposable VM with an affected kernel, rather
      than the shared Docker host kernel.
  exploit/osx/local/mac_dirty_cow:
    source_sha256: 29c8dd0c2c4000d6ce62fa49998f697b5397f2ef3a51e993d440dadc18b264ef
    disposition: separate_os_target
    reason: The module requires an affected macOS XNU kernel, native Mach-O execution
      and PAM file modification. The Linux Docker engine used by these labs cannot
      represent that operating system; qualification needs a disposable macOS target.
  auxiliary/scanner/snmp/xerox_workcentre_enumusers:
    source_sha256: be0b7c17110c50fe911245afa59b57ff6cac9c8ed4e72dd6d1b15f7f844f3833
    disposition: device_or_firmware_target
    reason: Successful enumeration reads the Xerox WorkCentre proprietary user table
      under enterprise OID 1.3.6.1.4.1.253. A generic snmpd container seeded with
      invented values would only test a simulation; a genuine printer or runnable
      matching firmware is required.
  auxiliary/scanner/vnc/ard_root_pw:
    source_sha256: f22433efa305402f2be7010da797f6ce094f18c71b9222d2cdb81164e50d54bc
    disposition: separate_os_target
    reason: The main function changes the real root account through the unpatched
      High Sierra Screen Sharing or Remote Management authentication bug. Linux
      x11vnc implements neither Apple's ARD security type nor that account database.
      Qualification needs a disposable affected macOS target; ordinary VNC
      password/None tests do not qualify this module.
  exploit/windows/smb/ms17_010_eternalblue:
    source_sha256: 4263c0676439a781e34cb87bff6a5b44cbdd92ec8c021030c47ea5b2e3532ad5
    disposition: separate_kernel_target
    reason: Exploitation depends on the affected Windows srv and srvnet kernel
      implementations and kernel-pool grooming. The Linux Docker engine and its
      genuine Samba service cannot supply those Windows kernel code paths.
      Qualification needs an isolated affected Windows VM with snapshots; a
      matching SMB banner or scanner response would not establish exploitation.
  auxiliary/scanner/snmp/cisco_config_tftp:
    source_sha256: 7f77d35739293c9c8ec59887fbdc51f491b0c611130269e74d6117a1b20898ae
    disposition: device_or_firmware_target
    reason: The module sets Cisco configuration-copy rows and expects the actual
      device to transfer its running or startup configuration through TFTP.
      Generic Net-SNMP cannot implement those IOS configuration-copy side effects
      merely by seeding OIDs. A genuine device or runnable matching vendor image
      is required; this is an image requirement, not a claim that an emulator
      or container with such an image is impossible.
