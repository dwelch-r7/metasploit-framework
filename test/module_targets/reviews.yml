      docker_daemon_registry: [real_pull, cached_image, missing_tag, exact_tag_prefix]
      docker_daemon_names: [explicit_reuse, stopped_collision, blank_name]
      docker_daemon_finite: [default_guard, explicit_manual_cleanup, linux, python]
      docker_daemon_28: [engine28, detection, linux_x64_meterpreter, python_meterpreter]
    reason: >-
      The genuine nested Engine26/28 Debian cron target qualifies both declared
      execution targets and covered authentication, registry and naming paths
      across43 cases and28 real session lifecycles. Native root-bind/cron/pull
      controls precede owner classification; source cleanup is checked before
      harness cleanup. Four finite UTF-8 command proofs explicitly opt into
      manual cleanup and retain that limit. Each serial project has three
      bounded outer services and at most one short-lived inner workload, with
      independently verified teardown. Older daemon releases, rootless and
      user-namespace variants, mTLS and kernel/runtime escapes remain separate.

  exploit/multi/mysql/mysql_udf_payload:
    source_sha256: 5adc37f850cd2afe22b1ecdaf21d3039ace91beb2935de195b7ca0f9fc213b4c
    disposition: container_lab
    lab_profiles:
      mysql_udf: [mysql8_linux_x64, x86_shell_meterpreter, standalone_and_mysql_session, fresh_reuse_force, native_denials]
    reason: >-
      Genuine MySQL8.0.36 qualifies nine native-gated cases with fourteen owner
      calls and twelve real sessions, including two native calibration sessions.
