      connection recovery and independently verified owned-resource teardown
      pass. Other releases, Unicode names, transports, concurrent DDL and
      authentication plugins remain unqualified.
  auxiliary/scanner/mysql/mysql_authbypass_hashdump:
    source_sha256: 826c4c045367b25874d820cf24379843c337bd990e5fdc633e9845b92be1eb8a
    disposition: container_lab
    lab_profiles:
      mysql_authbypass: [native_bypass, root_repeat, select_only, select_denied, closed_port]
