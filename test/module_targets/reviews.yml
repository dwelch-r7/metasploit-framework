      strict cases; fixed1.18.3 passes3 of3. Independent installer, both
      authentication portals and actual PDF/file controls pass before/after.
      Two repairs fix Base64-tail decoding and wrong-ticket selection;31
      focused contracts pass and the real canary repeats retain exact71bytes.
      Short-file/configuration truncation and missing credential persistence
      remain enabled failures, so complete gathering is not qualified. Actual
      notes persist; credential reporting cause remains unverified. See
      VERIFICATION-20261118-osticket.md. Only24owned Docker objects are removed.
  auxiliary/admin/2wire/xslt_password_reset:
    source_sha256: e4edd8e78fe93330273f7dc1345132b764fda1fde819e8f9d64733171b96c7e5
    disposition: device_or_firmware_target
    reason: >-
      The main path identifies a 2Wire version5 gateway, reads its XSLT
      system/password pages and posts H04_POST to change the administrator
      password. Qualification needs the genuine firmware authentication and
      persistent configuration state: independently verify old-password denial,
      new-password login, repeat execution and restoration of the original
      setting. A matching HTTP header, page or returned cookie supplies parsing
      evidence without establishing that device state. Keep an owned router or
      runnable matching firmware image as the target requirement; availability
      of such an image remains uninvestigated. No password is changed here.
  auxiliary/scanner/misc/cisco_smart_install:
    source_sha256: d15f0b6ac31a27ee7c90b2fefe1c5a9d0b03277efd4609a38c4c269b86da9fed
    disposition: device_or_firmware_target
    reason: >-
      Cover both SCAN and DOWNLOAD against a genuine Smart Install endpoint.
      DOWNLOAD sends an IOS copy system:running-config command inside the SMI
      packet and requires the target to initiate a real TFTP transfer whose
      configuration is then parsed and reported. Qualification needs owned
      firmware or a compatible vendor guest, known native configuration bytes,
      actual callback routing, reporting and listener cleanup/reuse. Generic
      TFTP alone supplies no Smart Install command executor. An appropriate
      guest/image remains future setup work; no switch command or transfer is
      performed by this source/document review.
  exploit/linux/misc/hp_jetdirect_path_traversal:
    source_sha256: 1d68da685529034427c12f43b600f7c63ac8687ff3565536fd7cd0135894541e
    disposition: device_or_firmware_target
    reason: >-
      The positive path traverses the printer's PJL filesystem into its
      profile.d startup directory, verifies the written command script and
      triggers an SNMP power-cycle reset. Qualification needs affected native
      printer firmware, its actual startup lifecycle, a used remote shell and
      verified script/session/telnetd cleanup. The human guide explicitly
      records intermittent telnetd cleanup and requires checking the port.
      A service image accepting PJL writes and an SNMP reset value cannot by
      itself establish that firmware execution path. An owned printer or
      runnable matching firmware guest remains required; no reboot, file write
      or exploit is performed by this review.
  exploit/linux/local/docker_privileged_container_kernel_escape:
    source_sha256: 4887c5ec8feac2ef2684a86765594f2e67dc1492d28af41dbba2a666b6afd897
    disposition: separate_kernel_target
    reason: >-
      The main path compiles a kernel module against the running kernel
      headers, loads it with insmod using SYS_MODULE, invokes
      call_usermodehelper in the host kernel and later attempts rmmod. An
      ordinary service image does not provide a private kernel or prove a
      host escape and kernel-module removal. Qualify shell and Meterpreter
      entry sessions in a disposable VM with matching headers and its own
      nested container runtime; verify host identity, session closure and
      actual module removal. No host kernel module is loaded by this source
      review.
  exploit/linux/local/docker_runc_escape:
    source_sha256: ccf06553caccbd9137bdd225945f4b33c12e165f26b49b7b423ca9204fcd7f14
    disposition: separate_host_target
    reason: >-
      The exploit overwrites a container shell with #!/proc/self/exe, waits
      for a real host docker exec and replaces the host runc executable
      through its process descriptor. Successful cleanup must restore that
      runtime binary and the original shell; a failed attempt can leave the
      engine unavailable. Use a disposable guest with its own affected
      runtime and verify the original runtime checksum, host-session
      identity and restoration for each payload target. A service container
      using the shared current engine cannot qualify that positive path. No
      shared runtime binary is changed by this review.
  exploit/linux/local/runc_cwd_priv_esc:
    source_sha256: 473818a518df7805ac792e76931a443de7b78d66f386d7f8e261a2c411b66939
    disposition: separate_host_target
    reason: >-
      The owning exploit invokes docker build against an affected runc, uses
      WORKDIR /proc/self/fd/<descriptor> to reach the runtime host and
      changes the host payload ownership and SUID bit before executing it.
      Its check also distinguishes distribution-specific runtime packages.
      Qualify against an isolated disposable guest with its own affected and
      fixed Docker/runc combinations, real low-privilege sessions and host
      filesystem permission controls. Copying a runc binary into an ordinary
      service image does not exercise the daemon runtime or prove host-root
      execution. No shared Docker socket or host filesystem is used by this
      review.
  exploit/windows/local/docker_credential_wincred:
    source_sha256: b3acafb2a668fbe827bbb307661eee7baa66d7356c72cbb5cd0a2f184bdc60c3
    disposition: separate_os_target
    reason: >-
      The main path requires a Windows Meterpreter session, Windows UAC
      state and a vulnerable Docker Desktop installation. It writes
      docker-credential-wincred.exe under
      ProgramData/DockerDesktop/version-bin and relies on a real privileged
      docker login trigger; the no-prompt UAC branch instead uses
      ShellExecute runas. A Linux service image or invented docker version
      output does not provide these desktop, credential-helper and elevation
      paths. Qualify in a disposable Windows guest with real login/elevation
      and artifact-restoration controls. No desktop settings, installed
      client or credentials are changed by this review.
  auxiliary/gather/minio_bootstrap_verify_info_disc:
    source_sha256: e8e1de4e51df1948f9a6ae76a8286bd6dbbf498e0ddb18aceedeba809c531ad0
    disposition: container_lab
    lab_profiles:
      minio: [vulnerable, fixed]
    reason: >-
      The standalone source-built MinIO lab qualifies both real cluster builds,
      bootstrap JSON loot, Untried SQL reporting, repeat/workspace isolation and
      real S3 reuse. Its dedicated launcher performs native controls before and
      after module execution; it is separate from the generic --all runner.
  post/multi/gather/minio_client:
    source_sha256: 06cfa49faabb2748f2a4367f3f20fccdf454a9dbd216ac041b427e9697ca9655
    disposition: container_lab
    lab_profiles:
      minio: [vulnerable]
    reason: >-
      The standalone MinIO lab qualifies genuine Linux shell and Meterpreter
      sessions across seven client input states each, with real mc configuration,
      exact text loot and input restoration. Windows shell, Windows Meterpreter,
      Windows PowerShell, macOS and other Unix targets remain individually
      pending.
  auxiliary/scanner/http/apache_activemq_traversal:
    source_sha256: bf2bfc08a0c95d945ac93128494cbdb449fe505d4819ad2347b3bf3c1a1e3559
    disposition: separate_os_target
    reason: The owning request constructs Windows-specific /\.. traversal
      sequences against the Jetty ResourceHandler in ActiveMQ 5.3.1/5.3.2.
      Its documented positive target is Windows Server 2003 SP2. The existing
      genuine Linux ActiveMQ source-disclosure and FileServer labs do not
      establish Windows pathname resolution or arbitrary Windows file reads.
      Qualify with an isolated affected Windows/JVM target and native file
      controls; do not count a Linux banner or a simulated response as success.
      Windows virtualization or compatibility-runtime feasibility remains a
      separate investigation, rather than a universal container exclusion.
  auxiliary/cloud/aws/enum_ssm:
    source_sha256: 867756d2f657d86bd78c2b7f26e75a1d9f42deeebfb327cc5a5a4f698968f051
    disposition: separate_cloud_target
    reason: The module enumerates EC2 resources through SSM GetInventory and can
      start an SSM-SessionManagerRunShell session using the returned stream URL
      and token. Qualifying that main session path requires an owned managed
      instance and actual SSM control/data planes. Running only an SSM agent in
      Docker does not supply those services. Emulator API responses would be
      compatibility evidence, not proof of the AWS session path; defer this
      module to a separately provisioned cloud target.
  auxiliary/cloud/aws/enum_ec2:
    source_sha256: d2618839aa32d55ee6d57976bdcb6e14ee1bf6c081999d3383e483c75aadc98c
    disposition: separate_cloud_target
    reason: The owning run enumerates AWS regions and EC2 instances, reporting
      network interfaces, tags, security groups and actual instance attributes.
      A local service container cannot supply the EC2 control plane or genuine
      EC2 resources. Qualify against owned cloud instances with native account
      and reporting controls; emulator-only enumeration would establish a
      different API compatibility result. No cloud credentials or resources
      are created by this review.
  auxiliary/cloud/aws/enum_iam:
    source_sha256: 3b152ace8fa788f593eaa52263369570aedc0cf124e980858323834a1ca7d9af
    disposition: separate_cloud_target
    reason: Successful collection uses IAM account authorization details and
      real user policies, access keys, signing certificates, login profiles and
      MFA devices. An invented IAM data set in a container would not confirm
      collection against the owning AWS identity service. Defer to a separate
      owned-account target with accepted and denied policies; no AWS account
      operations are performed here. This does not exclude S3-compatible
      services or other independently runnable cloud products.
  auxiliary/admin/aws/aws_launch_instances:
    source_sha256: 4ff4630f806bd021126d4bd1e6288cde2335b786b3606a2b733875debe945eae
    disposition: separate_cloud_target
    reason: The main function imports a key, selects or creates EC2 network
      resources, calls RunInstances, polls instance status and reads the actual
      instance IP. RHOST permits an alternate endpoint, but an emulator returning
      instance records would not establish a launched guest or working userdata.
      Qualify with an owned disposable cloud guest and explicit resource cleanup
      in a separate cloud campaign; an ordinary Compose service is insufficient
      for those positive-path claims. No instances are launched by this review.
  exploit/linux/local/docker_cgroup_escape:
    source_sha256: 79da55cad312aa93a357f70a47eab3fe0145933b7dbba8482b4e4b10d6e6c747
    disposition: separate_kernel_target
    reason: The exploit mounts cgroup v1, writes notify_on_release and release_agent,
      resolves the actual host overlay upperdir, and asks the host kernel to execute
      its payload there. An ordinary service image cannot supply the affected host
      kernel or establish a host-root escape. Qualification requires a disposable
      VM with the matching kernel, cgroup setup and nested container engine, rather
      than changing the shared Docker host.
  exploit/linux/local/docker_privileged_container_escape:
    source_sha256: dadc76c8e9f6f2db484083c2271c4ac38265a105b1eba98d462cf153e18baa2d
    disposition: separate_host_target
    reason: The main function writes a cgroup release_agent and executes either
      docker cp or a search of the host overlay filesystem to obtain host root.
      A service container with invented host paths would not verify that escape.
      Use a disposable VM with its own privileged nested container and compatible
      cgroup v1 host setup; the shared Docker engine is not an isolated target.
  exploit/linux/local/cve_2022_1043_io_uring_priv_esc:
    source_sha256: 2d77815354c78e070cc9d77a92479d9efe1428314b86ea19016e9cc58864bf72
    disposition: separate_kernel_target
    reason: >-
      The owning exploit uploads or compiles native io_uring code that hijacks
      kernel credentials and creates a SUID executable. Its bundled source
      deliberately keeps processes alive because releasing the damaged
      credentials can panic the kernel. A service image cannot supply a
      separate vulnerable kernel or verify safe guest shutdown. Use a
      disposable VM with its own affected kernel, more than one CPU, both
      declared shell and Meterpreter entry sessions, root execution and
      complete guest disposal. No io_uring exploit code is run by this source
      review.
  exploit/linux/local/cve_2021_3490_ebpf_alu32_bounds_check_lpe:
    source_sha256: 45448289d6123b39b038a6901ed5e7fe3b390cb5b181a8395836848748148f36
    disposition: separate_kernel_target
    reason: >-
      The owning check depends on the running kernel, distribution-specific
      build, CONFIG_BPF_SYSCALL and unprivileged BPF policy. Execution selects
      a kernel-specific native exploit; its bundled source loads BPF programs
      and overwrites process credentials in kernel memory. An ordinary image
      with an old userspace cannot supply that kernel. Qualify in a disposable
      affected/fixed guest matrix with genuine low-privilege shell and
      Meterpreter entry sessions, root execution and cleanup. No BPF program
      is loaded or host sysctl changed by this review.
  exploit/linux/local/bpf_sign_extension_priv_esc:
    source_sha256: 06cd4cab0969fb7091e43afb5b6c991b02843a318a9e37460ab8bc9ed4bdee88
    disposition: separate_kernel_target
    reason: >-
      The owning exploit compiles or drops native BPF code that obtains kernel
      read/write and overwrites process credentials before opening a shell.
      Its check also depends on the real kernel, CONFIG_BPF_SYSCALL, BPF
      policy and hardening state. A service image cannot isolate or replace
      the shared kernel for that positive path. Use disposable affected/fixed
      kernel guests, both declared shell and Meterpreter entry sessions,
      actual privilege proof and artifact/process cleanup. The separate
      source-level check return-type concern is unqualified; no BPF code is
      run by this review.
  exploit/linux/local/cve_2022_0847_dirtypipe:
    source_sha256: fcd75cb71f8873db2231b89880caeeed83668e2fa9c558982987b5a75f8332e9
    disposition: separate_kernel_target
    reason: The check reads the running kernel and the exploit modifies SUID file
      pages through the kernel bug. A service image cannot supply its own vulnerable
      kernel; qualification needs a disposable VM with an affected kernel, rather
      than the shared Docker host kernel.
  exploit/osx/local/mac_dirty_cow:
    source_sha256: 29c8dd0c2c4000d6ce62fa49998f697b5397f2ef3a51e993d440dadc18b264ef
    disposition: separate_os_target
    reason: The module requires an affected macOS XNU kernel, native Mach-O execution
      and PAM file modification. The Linux Docker engine used by these labs cannot
      represent that operating system; qualification needs a disposable macOS target.
  auxiliary/scanner/snmp/xerox_workcentre_enumusers:
    source_sha256: be0b7c17110c50fe911245afa59b57ff6cac9c8ed4e72dd6d1b15f7f844f3833
    disposition: device_or_firmware_target
    reason: Successful enumeration reads the Xerox WorkCentre proprietary user table
      under enterprise OID 1.3.6.1.4.1.253. A generic snmpd container seeded with
      invented values would only test a simulation; a genuine printer or runnable
      matching firmware is required.
  auxiliary/scanner/vnc/ard_root_pw:
    source_sha256: f22433efa305402f2be7010da797f6ce094f18c71b9222d2cdb81164e50d54bc
    disposition: separate_os_target
    reason: The main function changes the real root account through the unpatched
      High Sierra Screen Sharing or Remote Management authentication bug. Linux
      x11vnc implements neither Apple's ARD security type nor that account database.
      Qualification needs a disposable affected macOS target; ordinary VNC
      password/None tests do not qualify this module.
  exploit/windows/smb/ms17_010_eternalblue:
    source_sha256: 4263c0676439a781e34cb87bff6a5b44cbdd92ec8c021030c47ea5b2e3532ad5
    disposition: separate_kernel_target
    reason: Exploitation depends on the affected Windows srv and srvnet kernel
      implementations and kernel-pool grooming. The Linux Docker engine and its
      genuine Samba service cannot supply those Windows kernel code paths.
      Qualification needs an isolated affected Windows VM with snapshots; a
      matching SMB banner or scanner response would not establish exploitation.
  auxiliary/scanner/snmp/cisco_config_tftp:
    source_sha256: 7f77d35739293c9c8ec59887fbdc51f491b0c611130269e74d6117a1b20898ae
    disposition: device_or_firmware_target
    reason: The module sets Cisco configuration-copy rows and expects the actual
      device to transfer its running or startup configuration through TFTP.
      Generic Net-SNMP cannot implement those IOS configuration-copy side effects
      merely by seeding OIDs. A genuine device or runnable matching vendor image
      is required; this is an image requirement, not a claim that an emulator
      or container with such an image is impossible.
  auxiliary/scanner/misc/java_rmi_server:
    source_sha256: afbec89af215cfa1637cc06100edfe9ab112a3b4fb2992b7c7a58ad8857ac3b1
    disposition: historical_jvm_required
    reason: >-
      Genuine Temurin 17.0.21+9 DGC controls failed before any owning call.
      Modern vendor dispatch ignores client codebase annotations, and an
      explicit server HTTP codebase is still denied SocketPermission connect
      by the restricted DGC context despite AllPermission and a permissive
      filter. Preserve the original eighteen-case deferred Java profile and
      investigate a genuine historical runtime; do not substitute a patched
      dispatcher or count ordinary registry/JMX success as this scanner's
      qualification. This is a target prerequisite finding, not a verified
      Framework scanner defect or universal Docker exclusion.
  auxiliary/gather/zoomeye_search:
    source_sha256: 4f862151c8fc3ba7fa977a70485a7b295d87bd3273e58f3e127a5a36d4720e99
    disposition: separate_cloud_target
    reason: >-
      The main search path queries fixed HTTPS api.zoomeye.ai/v2/search with an
      API key and consumes the provider's host/web records, facets and pages.
      The documentation's container-keyword match comes from "composed" in
      search-query prose, which supplies no target deployment. The provider's
      published SDK documents API-key-authenticated hosted searches; a local
      HTTP container seeded with invented records cannot qualify those provider
      query, authentication and index contracts. Use a separate owned API/account
      target for positive, denied, pagination and reporting controls. Docker can
      host the client; this is a target requirement, not a blanket container
      exclusion. No provider queries or account operations were performed.
  auxiliary/scanner/http/es_file_explorer_open_port:
    source_sha256: dd9400c33c25446d2c22b689e1f94260043e8bd86d600305e78271fce48bd6b9
    disposition: separate_android_target
    reason: >-
      The owning actions enumerate actual Android storage, media and installed
      packages, download device files and launch APK activities through the
      vulnerable ES File Explorer app. The documentation's container matches
      are com.android.defcontainer package names in old device output, not a
      target deployment. A fabricated HTTP service would not qualify those
      device/app state contracts. Use a separate owned Android device or genuine
      host emulator with the affected app and known content/package controls.
      Android's emulator guidance restricts VM acceleration inside nested
      Docker/VM environments, so a low-resource Linux HTTP container is not a
      substitute. This is an individual target prerequisite, not a universal
      emulator/container exclusion or a verified module failure. No APK was
      installed and no device or app operation was performed.
    sources:
      - https://github.com/fs0c131y/ESFileExplorerOpenPortVuln
      - https://developer.android.com/studio/run/emulator-acceleration#restrictions

  exploit/linux/http/docker_daemon_tcp:
    source_sha256: 9c7457976af6256c9891bf45845d2c097d923feef8bb9658f27636a99e0b5f21
    disposition: container_lab
    lab_profiles:
      docker_daemon: [engine26, detection, linux_x64_meterpreter, python_meterpreter]
      docker_daemon_shells: [linux_x64_shell, python_shell]
      docker_daemon_auth: [http_tls_denied, forced_and_disabled_autocheck]
      docker_daemon_gateways: [nginx, http_basic, tls_basic]
      docker_daemon_registry: [real_pull, cached_image, missing_tag, exact_tag_prefix]
      docker_daemon_names: [explicit_reuse, stopped_collision, blank_name]
      docker_daemon_finite: [default_guard, explicit_manual_cleanup, linux, python]
      docker_daemon_28: [engine28, detection, linux_x64_meterpreter, python_meterpreter]
    reason: >-
      The genuine nested Engine26/28 Debian cron target qualifies both declared
      execution targets and covered authentication, registry and naming paths
      across43 cases and28 real session lifecycles. Native root-bind/cron/pull
      controls precede owner classification; source cleanup is checked before
      harness cleanup. Four finite UTF-8 command proofs explicitly opt into
      manual cleanup and retain that limit. Each serial project has three
      bounded outer services and at most one short-lived inner workload, with
      independently verified teardown. Older daemon releases, rootless and
      user-namespace variants, mTLS and kernel/runtime escapes remain separate.

  exploit/multi/mysql/mysql_udf_payload:
    source_sha256: 5adc37f850cd2afe22b1ecdaf21d3039ace91beb2935de195b7ca0f9fc213b4c
    disposition: container_lab
    lab_profiles:
      mysql_udf: [mysql8_linux_x64, x86_shell_meterpreter, standalone_and_mysql_session, fresh_reuse_force, native_denials]
    reason: >-
      Genuine MySQL8.0.36 qualifies nine native-gated cases with fourteen owner
      calls and twelve real sessions, including two native calibration sessions.
      Three separate repairs address borrowed authentication return, nullable
      catalog discovery and callback/foreground command lifecycle. Exact UDF
      and generated ELF hashes, responsive UID/PID markers, SQL identity and
      selected session/file/catalog recovery are verified. Two capped services
      and all owned objects are removed; unrelated containers are preserved.
      Windows, Linux x86 database servers, other database versions, TLS and
      staged payloads remain unqualified. The existing UDF is unchanged and its
      exact source/build provenance is not established by related upstream bytes.

  auxiliary/gather/suite_crm_export_sqli:
    source_sha256: 6c98ab221309f2cac6c62f22e61bd16cff648bae8afff27bd17f49aec451828a
    disposition: container_lab
    lab_profiles:
      suitecrm: [official_7_12_5, native_boolean_controls, count_and_reporting, repeats_and_errors]
      suitecrm_fixed: [official_7_12_6, native_fixed_control, autocheck_refusal]
      suitecrm_names: [native_utf8_comma_apostrophe, administrator_and_nonadministrator, byte_and_length_inference]
    reason: >-
      Official SuiteCRM 7.12.5/7.12.6 qualify twenty-two native-gated cases on
      PHP 7.4.33/MariaDB 10.6.19. Individual HEX rows preserve names without
      aggregation limits; exact literal lookup, finite byte inference and
      serialization-safe predicates preserve native UTF-8/comma/apostrophe
      values. CSV response validation rejects error pages. Actual administrator
      and nonadministrator collection, COUNT transitions, exact credential
      type/origin/endpoint, repeats and native 1600-byte/UTF-8 controls pass.
      Existing passive check/count repairs retain coverage. An initial direct
      oracle candidate failed real wire validation and remains unqualified.
      Three capped services run serially; selected native state and owned
      teardown pass. Other names/releases/engines, URL prefixes, TLS and further
      authorization settings remain separate. Existing CVE mapping unresolved.
