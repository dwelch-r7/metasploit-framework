# Individual source-reviewed target requirements; these are not blanket exclusions.
---
modules:
  auxiliary/gather/minio_bootstrap_verify_info_disc:
    source_sha256: e8e1de4e51df1948f9a6ae76a8286bd6dbbf498e0ddb18aceedeba809c531ad0
    disposition: container_lab
    lab_profiles:
      minio: [vulnerable, fixed]
    reason: >-
      The standalone source-built MinIO lab qualifies both real cluster builds,
      bootstrap JSON loot, Untried SQL reporting, repeat/workspace isolation and
      real S3 reuse. Its dedicated launcher performs native controls before and
      after module execution; it is separate from the generic --all runner.
  post/multi/gather/minio_client:
    source_sha256: 06cfa49faabb2748f2a4367f3f20fccdf454a9dbd216ac041b427e9697ca9655
    disposition: container_lab
    lab_profiles:
      minio: [vulnerable]
    reason: >-
      The standalone MinIO lab qualifies genuine Linux shell and Meterpreter
      sessions across seven client input states each, with real mc configuration,
      exact text loot and input restoration. Windows shell, Windows Meterpreter,
      Windows PowerShell, macOS and other Unix targets remain individually
      pending.
  auxiliary/scanner/http/apache_activemq_traversal:
    source_sha256: bf2bfc08a0c95d945ac93128494cbdb449fe505d4819ad2347b3bf3c1a1e3559
    disposition: separate_os_target
    reason: The owning request constructs Windows-specific /\.. traversal
      sequences against the Jetty ResourceHandler in ActiveMQ 5.3.1/5.3.2.
      Its documented positive target is Windows Server 2003 SP2. The existing
      genuine Linux ActiveMQ source-disclosure and FileServer labs do not
      establish Windows pathname resolution or arbitrary Windows file reads.
      Qualify with an isolated affected Windows/JVM target and native file
      controls; do not count a Linux banner or a simulated response as success.
      Windows virtualization or compatibility-runtime feasibility remains a
      separate investigation, rather than a universal container exclusion.
  auxiliary/cloud/aws/enum_ssm:
    source_sha256: 867756d2f657d86bd78c2b7f26e75a1d9f42deeebfb327cc5a5a4f698968f051
    disposition: separate_cloud_target
    reason: The module enumerates EC2 resources through SSM GetInventory and can
      start an SSM-SessionManagerRunShell session using the returned stream URL
      and token. Qualifying that main session path requires an owned managed
      instance and actual SSM control/data planes. Running only an SSM agent in
      Docker does not supply those services. Emulator API responses would be
      compatibility evidence, not proof of the AWS session path; defer this
      module to a separately provisioned cloud target.
  auxiliary/cloud/aws/enum_ec2:
    source_sha256: d2618839aa32d55ee6d57976bdcb6e14ee1bf6c081999d3383e483c75aadc98c
    disposition: separate_cloud_target
    reason: The owning run enumerates AWS regions and EC2 instances, reporting
      network interfaces, tags, security groups and actual instance attributes.
      A local service container cannot supply the EC2 control plane or genuine
      EC2 resources. Qualify against owned cloud instances with native account
      and reporting controls; emulator-only enumeration would establish a
      different API compatibility result. No cloud credentials or resources
      are created by this review.
  auxiliary/cloud/aws/enum_iam:
    source_sha256: 3b152ace8fa788f593eaa52263369570aedc0cf124e980858323834a1ca7d9af
    disposition: separate_cloud_target
    reason: Successful collection uses IAM account authorization details and
      real user policies, access keys, signing certificates, login profiles and
      MFA devices. An invented IAM data set in a container would not confirm
      collection against the owning AWS identity service. Defer to a separate
      owned-account target with accepted and denied policies; no AWS account
      operations are performed here. This does not exclude S3-compatible
      services or other independently runnable cloud products.
  auxiliary/admin/aws/aws_launch_instances:
    source_sha256: 4ff4630f806bd021126d4bd1e6288cde2335b786b3606a2b733875debe945eae
    disposition: separate_cloud_target
    reason: The main function imports a key, selects or creates EC2 network
      resources, calls RunInstances, polls instance status and reads the actual
      instance IP. RHOST permits an alternate endpoint, but an emulator returning
      instance records would not establish a launched guest or working userdata.
      Qualify with an owned disposable cloud guest and explicit resource cleanup
      in a separate cloud campaign; an ordinary Compose service is insufficient
      for those positive-path claims. No instances are launched by this review.
  exploit/linux/local/docker_cgroup_escape:
    source_sha256: 79da55cad312aa93a357f70a47eab3fe0145933b7dbba8482b4e4b10d6e6c747
    disposition: separate_kernel_target
    reason: The exploit mounts cgroup v1, writes notify_on_release and release_agent,
      resolves the actual host overlay upperdir, and asks the host kernel to execute
      its payload there. An ordinary service image cannot supply the affected host
      kernel or establish a host-root escape. Qualification requires a disposable
      VM with the matching kernel, cgroup setup and nested container engine, rather
      than changing the shared Docker host.
  exploit/linux/local/docker_privileged_container_escape:
    source_sha256: dadc76c8e9f6f2db484083c2271c4ac38265a105b1eba98d462cf153e18baa2d
    disposition: separate_host_target
    reason: The main function writes a cgroup release_agent and executes either
      docker cp or a search of the host overlay filesystem to obtain host root.
      A service container with invented host paths would not verify that escape.
      Use a disposable VM with its own privileged nested container and compatible
      cgroup v1 host setup; the shared Docker engine is not an isolated target.
  exploit/linux/local/cve_2022_0847_dirtypipe:
    source_sha256: fcd75cb71f8873db2231b89880caeeed83668e2fa9c558982987b5a75f8332e9
    disposition: separate_kernel_target
    reason: The check reads the running kernel and the exploit modifies SUID file
      pages through the kernel bug. A service image cannot supply its own vulnerable
      kernel; qualification needs a disposable VM with an affected kernel, rather
      than the shared Docker host kernel.
  exploit/osx/local/mac_dirty_cow:
    source_sha256: 29c8dd0c2c4000d6ce62fa49998f697b5397f2ef3a51e993d440dadc18b264ef
    disposition: separate_os_target
    reason: The module requires an affected macOS XNU kernel, native Mach-O execution
      and PAM file modification. The Linux Docker engine used by these labs cannot
      represent that operating system; qualification needs a disposable macOS target.
  auxiliary/scanner/snmp/xerox_workcentre_enumusers:
    source_sha256: be0b7c17110c50fe911245afa59b57ff6cac9c8ed4e72dd6d1b15f7f844f3833
    disposition: device_or_firmware_target
    reason: Successful enumeration reads the Xerox WorkCentre proprietary user table
      under enterprise OID 1.3.6.1.4.1.253. A generic snmpd container seeded with
      invented values would only test a simulation; a genuine printer or runnable
      matching firmware is required.
  auxiliary/scanner/vnc/ard_root_pw:
    source_sha256: f22433efa305402f2be7010da797f6ce094f18c71b9222d2cdb81164e50d54bc
    disposition: separate_os_target
    reason: The main function changes the real root account through the unpatched
      High Sierra Screen Sharing or Remote Management authentication bug. Linux
      x11vnc implements neither Apple's ARD security type nor that account database.
      Qualification needs a disposable affected macOS target; ordinary VNC
      password/None tests do not qualify this module.
  exploit/windows/smb/ms17_010_eternalblue:
    source_sha256: 4263c0676439a781e34cb87bff6a5b44cbdd92ec8c021030c47ea5b2e3532ad5
    disposition: separate_kernel_target
    reason: Exploitation depends on the affected Windows srv and srvnet kernel
      implementations and kernel-pool grooming. The Linux Docker engine and its
      genuine Samba service cannot supply those Windows kernel code paths.
      Qualification needs an isolated affected Windows VM with snapshots; a
      matching SMB banner or scanner response would not establish exploitation.
  auxiliary/scanner/snmp/cisco_config_tftp:
    source_sha256: 7f77d35739293c9c8ec59887fbdc51f491b0c611130269e74d6117a1b20898ae
    disposition: device_or_firmware_target
    reason: The module sets Cisco configuration-copy rows and expects the actual
      device to transfer its running or startup configuration through TFTP.
      Generic Net-SNMP cannot implement those IOS configuration-copy side effects
      merely by seeding OIDs. A genuine device or runnable matching vendor image
      is required; this is an image requirement, not a claim that an emulator
      or container with such an image is impossible.
  auxiliary/scanner/misc/java_rmi_server:
    source_sha256: afbec89af215cfa1637cc06100edfe9ab112a3b4fb2992b7c7a58ad8857ac3b1
    disposition: historical_jvm_required
    reason: >-
      Genuine Temurin 17.0.21+9 DGC controls failed before any owning call.
      Modern vendor dispatch ignores client codebase annotations, and an
      explicit server HTTP codebase is still denied SocketPermission connect
      by the restricted DGC context despite AllPermission and a permissive
      filter. Preserve the original eighteen-case deferred Java profile and
      investigate a genuine historical runtime; do not substitute a patched
      dispatcher or count ordinary registry/JMX success as this scanner's
      qualification. This is a target prerequisite finding, not a verified
      Framework scanner defect or universal Docker exclusion.
  auxiliary/gather/zoomeye_search:
    source_sha256: 4f862151c8fc3ba7fa977a70485a7b295d87bd3273e58f3e127a5a36d4720e99
    disposition: separate_cloud_target
    reason: >-
      The main search path queries fixed HTTPS api.zoomeye.ai/v2/search with an
      API key and consumes the provider's host/web records, facets and pages.
      The documentation's container-keyword match comes from "composed" in
      search-query prose, which supplies no target deployment. The provider's
      published SDK documents API-key-authenticated hosted searches; a local
      HTTP container seeded with invented records cannot qualify those provider
      query, authentication and index contracts. Use a separate owned API/account
      target for positive, denied, pagination and reporting controls. Docker can
      host the client; this is a target requirement, not a blanket container
      exclusion. No provider queries or account operations were performed.
  auxiliary/scanner/http/es_file_explorer_open_port:
    source_sha256: dd9400c33c25446d2c22b689e1f94260043e8bd86d600305e78271fce48bd6b9
    disposition: separate_android_target
    reason: >-
      The owning actions enumerate actual Android storage, media and installed
      packages, download device files and launch APK activities through the
      vulnerable ES File Explorer app. The documentation's container matches
      are com.android.defcontainer package names in old device output, not a
      target deployment. A fabricated HTTP service would not qualify those
      device/app state contracts. Use a separate owned Android device or genuine
      host emulator with the affected app and known content/package controls.
      Android's emulator guidance restricts VM acceleration inside nested
      Docker/VM environments, so a low-resource Linux HTTP container is not a
      substitute. This is an individual target prerequisite, not a universal
      emulator/container exclusion or a verified module failure. No APK was
      installed and no device or app operation was performed.
    sources:
      - https://github.com/fs0c131y/ESFileExplorerOpenPortVuln
      - https://developer.android.com/studio/run/emulator-acceleration#restrictions
