ServerName module-target-superset
# The vendor worker defaults exceed the lab's unchanged 64-task cgroup cap.
# This serial lab needs only a small real HTTP worker pool.
<IfModule mpm_event_module>
  StartServers 1
  ServerLimit 2
  ThreadLimit 8
  ThreadsPerChild 8
  MinSpareThreads 4
  MaxSpareThreads 12
  MaxRequestWorkers 16
</IfModule>
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
ProxyRequests Off
ProxyPass /unrelated/ !
Alias /unrelated/ /usr/local/apache2/htdocs/
ProxyPass / http://app:8088/
ProxyPassReverse / http://app:8088/
