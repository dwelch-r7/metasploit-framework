LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
Listen 11800
Listen 11801
Listen 11802
<VirtualHost *:11800>
  ProxyPass /nested/ http://ollama:11434/
  ProxyPassReverse /nested/ http://ollama:11434/
  ProxyPass / http://ollama:11434/
  ProxyPassReverse / http://ollama:11434/
</VirtualHost>
<VirtualHost *:11801>
  ProxyPass / http://ollama:11434/
  ProxyPassReverse / http://ollama:11434/
  <Location /api/show>
    AuthType Basic
    AuthName "Module target model details"
    AuthUserFile /tmp/ollama.htpasswd
    Require valid-user
  </Location>
</VirtualHost>
<VirtualHost *:11802>
  ProxyPass / http://ollama:11434/
  ProxyPassReverse / http://ollama:11434/
  <Location />
    AuthType Basic
    AuthName "Module target Ollama"
    AuthUserFile /tmp/ollama.htpasswd
    Require valid-user
  </Location>
</VirtualHost>
