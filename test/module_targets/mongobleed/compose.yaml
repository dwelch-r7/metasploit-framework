x-mongo: &mongo
  ports: ["127.0.0.1::27017"]
  healthcheck:
    test: ["CMD", "mongo", "--quiet", "--eval", "if (db.runCommand({ping:1}).ok !== 1) quit(1); print(db.version());"]
    interval: 2s
    timeout: 5s
    retries: 40

services:
  vulnerable:
    <<: *mongo
    image: mongo:4.4.29@sha256:52c42cbab240b3c5b1748582cc13ef46d521ddacae002bbbda645cebed270ec0
    command: ["mongod", "--bind_ip_all", "--networkMessageCompressors", "zlib"]
  authenticated:
    <<: *mongo
    image: mongo:4.4.29@sha256:52c42cbab240b3c5b1748582cc13ef46d521ddacae002bbbda645cebed270ec0
    command: ["mongod", "--bind_ip_all", "--networkMessageCompressors", "zlib"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: labadmin
      MONGO_INITDB_ROOT_PASSWORD: labpassword
    healthcheck:
      # The image temporarily starts an unauthenticated localhost daemon while
      # provisioning. Wait for the final authenticated configuration.
      test: ["CMD", "mongo", "--quiet", "--username", "labadmin", "--password", "labpassword", "--authenticationDatabase", "admin", "--eval", "var cfg = db.adminCommand({getCmdLineOpts:1}).parsed; if (!cfg || !cfg.security || cfg.security.authorization !== 'enabled') quit(1); print(db.version());"]
      interval: 2s
      timeout: 5s
      retries: 40
  guarded:
    <<: *mongo
    image: mongo:4.4.29@sha256:52c42cbab240b3c5b1748582cc13ef46d521ddacae002bbbda645cebed270ec0
    command: ["mongod", "--bind_ip_all", "--networkMessageCompressors", "snappy"]
  fixed:
    <<: *mongo
    image: mongo:4.4.30@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
    command: ["mongod", "--bind_ip_all", "--networkMessageCompressors", "zlib"]
  apache:
    extends:
      file: ../http/compose.yaml
      service: apache
    build: ../http
