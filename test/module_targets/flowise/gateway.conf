ServerName module-target-flowise
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
Listen 81
Listen 82
ProxyRequests Off
<VirtualHost *:80>
  ProxyPass /api/ http://app:3000/api/
  ProxyPassReverse /api/ http://app:3000/api/
  Alias /native/ /module-target-artifacts/
  <Directory /module-target-artifacts>
    Require all granted
    Options -Indexes
  </Directory>
</VirtualHost>
<VirtualHost *:81>
  DocumentRoot /usr/local/apache2/htdocs
</VirtualHost>
<VirtualHost *:82>
  ProxyPass / http://app:3000/module-target-absent/
  ProxyPassReverse / http://app:3000/module-target-absent/
</VirtualHost>
