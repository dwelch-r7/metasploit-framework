services:
  target:
    platform: linux/amd64
    init: true
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    ports: [{target: 8080, host_ip: 127.0.0.1}]
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 40
  framework:
    cpus: 1
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
