{
  "services": {
    "db": {
      "extends": {
        "file": "../simple_file_list/services.yaml",
        "service": "db"
      }
    },
    "app": {
      "extends": {
        "file": "../simple_file_list/services.yaml",
        "service": "app"
      },
      "environment": {
        "SFL_RELEASE": "4.2.2",
        "LAB_PREFIX": "/portal",
        "LAB_PLAIN": "0"
      },
      "volumes": [
        "../../../tmp/module-target-simple-file-list-sources/4.2.2.zip:/opt/module-target/plugin.zip:ro"
      ],
      "working_dir": "/var/www/html/portal"
    },
    "reporting_db": {
      "extends": {
        "file": "../simple_file_list/services.yaml",
        "service": "reporting_db"
      }
    }
  },
  "networks": {
    "default": {
      "internal": true
    },
    "public": {}
  }
}
