{
  "services": {
    "target": {
      "extends": {
        "file": "../invoiceshelf/compose.yaml",
        "service": "target"
      },
      "volumes": [
        "../invoiceshelf/process_state.php:/opt/module-target-process_state.php:ro",
        "../invoiceshelf/callback.php:/opt/module-target-callback.php:ro"
      ]
    },
    "reporting_db": {
      "extends": {
        "file": "../gopher/compose.yaml",
        "service": "reporting_db"
      },
      "ports": [
        "127.0.0.1::5432"
      ]
    }
  }
}
