{
  "services": {
    "linux": {
      "platform": "linux/amd64",
      "build": ".",
      "hostname": "module-target-fetchmail",
      "volumes": [
        "./fixtures:/opt/fetchmail-fixtures:ro",
        "./fixture_native.py:/opt/fetchmail-fixture-native.py:ro",
        "./native_probe.py:/opt/fetchmail-native.py:ro",
        "./case_state.py:/opt/fetchmail-case-state.py:ro",
        "../linux_post/launch_session.py:/opt/launch_session.py:ro"
      ],
      "ports": [
        "127.0.0.1::110"
      ],
      "cpus": 0.5,
      "mem_limit": "512m",
      "memswap_limit": "512m",
      "pids_limit": 128,
      "init": true,
      "healthcheck": {
        "test": [
          "CMD",
          "doveadm",
          "auth",
          "test",
          "module_target",
          "module-target-password"
        ],
        "interval": "3s",
        "timeout": "4s",
        "retries": 40
      }
    },
    "reporting_db": {
      "platform": "linux/amd64",
      "extends": {
        "file": "../elasticsearch_memory/services.yaml",
        "service": "db"
      }
    }
  },
  "networks": {
    "default": {},
    "public": {}
  }
}
