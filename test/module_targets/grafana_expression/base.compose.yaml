services:
  grafana:
    image: grafana/grafana:11.0.5-ubuntu@sha256:8f14eeb9ded6f863dde449074d9dda71e3ac3c33126c0eb9075203a17aa241ef
    platform: linux/amd64
    environment:
      HOME: /usr/share/grafana
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_LOG_LEVEL: info
      GF_SECURITY_ADMIN_USER: module-lab-admin
      GF_SECURITY_ADMIN_PASSWORD: module-target-grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports: ["127.0.0.1::3000"]
    volumes:
      - ${MODULE_TARGET_ROOT:?Set by the module target runner}/test/module_targets/grafana_expression/proof.txt:/etc/grafana/module-target-proof.txt:ro
    mem_limit: 768m
    cpus: 1.25
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 2s
      timeout: 4s
      retries: 45
  unrelated:
    extends: {file: ../http/compose.yaml, service: apache}
    mem_limit: 64m
    cpus: 0.25
  framework:
    extends: {file: ../framework.compose.yaml, service: framework}
    mem_limit: 1024m
    cpus: 1.0
