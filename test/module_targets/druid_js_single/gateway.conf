ServerName module-target-druid
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
ProxyRequests Off
ProxyPass /app/ http://app:8081/
ProxyPassReverse /app/ http://app:8081/
ProxyPass /prefix/ http://app:8081/
ProxyPassReverse /prefix/ http://app:8081/
ProxyPass /auth/ http://app:8081/
ProxyPassReverse /auth/ http://app:8081/
ProxyPass /denied/ http://app:8081/
ProxyPassReverse /denied/ http://app:8081/
<Location /auth/>
    AuthType Basic
    AuthName "Native Druid frontend"
    AuthUserFile /tmp/module-users
    Require valid-user
</Location>
<Location /denied/>
    AuthType Basic
    AuthName "Native Druid frontend"
    AuthUserFile /tmp/module-users
    Require user admin
</Location>
