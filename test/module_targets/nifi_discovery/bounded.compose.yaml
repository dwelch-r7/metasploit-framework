x-nifi-limits: &nifi_limits
  cpus: 2.0
  memswap_limit: 1536m
  pids_limit: 512

services:
  legacy:
    extends: {file: ../nifi/compose.yaml, service: legacy}
    <<: *nifi_limits
  vulnerable:
    extends: {file: ../nifi/compose.yaml, service: vulnerable}
    <<: *nifi_limits
  fixed:
    extends: {file: ../nifi/compose.yaml, service: fixed}
    <<: *nifi_limits
  unrelated:
    extends: {file: ../nifi/compose.yaml, service: unrelated}
    cpus: 0.2
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
  reporting_db:
    extends: {file: ../gopher/compose.yaml, service: reporting_db}
  framework:
    cpus: 1.5
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
