[general]
context=module-target
bindaddr=0.0.0.0
bindport=5060
udpbindaddr=0.0.0.0:5060
tcpenable=yes
tcpbindaddr=0.0.0.0:5060
tlsenable=yes
tlsbindaddr=0.0.0.0:5061
tlscertfile=/etc/asterisk/module-target.pem
transport=udp,tcp,tls
allowguest=no
alwaysauthreject=ALWAYS_AUTH_REJECT
auth_options_requests=AUTH_OPTIONS_REQUESTS
useragent=Module Target Asterisk 18.10.0
realm=module-target-sip
srvlookup=no
allowtransfer=no
nat=no
disallow=all
allow=ulaw
[1000]
type=friend
host=dynamic
context=module-target
transport=udp,tcp,tls
[1001]
type=friend
host=dynamic
secret=module-target-sip-password
context=module-target
transport=udp,tcp,tls
