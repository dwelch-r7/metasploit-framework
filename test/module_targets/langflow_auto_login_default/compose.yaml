{
  "services": {
    "target": {
      "extends": {
        "file": "../langflow/compose.yaml",
        "service": "target"
      },
      "environment": {
        "LANGFLOW_AUTO_LOGIN": "true"
      },
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ],
      "volumes": [
        "../h2_console/process_state.py:/opt/module-target-process-state.py:ro"
      ],
      "networks": [
        "default",
        "public"
      ]
    },
    "reporting_db": {
      "extends": {
        "file": "../gopher/compose.yaml",
        "service": "reporting_db"
      },
      "ports": [
        "127.0.0.1::5432"
      ],
      "networks": [
        "default",
        "public"
      ]
    }
  },
  "networks": {
    "default": {
      "internal": true
    },
    "public": {}
  }
}
