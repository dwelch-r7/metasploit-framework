---
services:
  db:
    extends: {file: ../depicter/services.yaml, service: db}
  app:
    extends: {file: ../depicter/services.yaml, service: root}
    environment:
      DEPICTER_RELEASE: "3.6.1"
      DEPICTER_MODE: affected
      WORDPRESS_TABLE_PREFIX: dp_
    volumes:
    - ../../../tmp/module-target-depicter-sources/3.6.1.zip:/opt/module-target/plugin.zip:ro
  reporting_db:
    extends: {file: ../depicter/services.yaml, service: reporting_db}
networks:
  default: {internal: true}
  public: {}
