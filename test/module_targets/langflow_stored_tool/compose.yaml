services:
  target:
    extends: {file: ../langflow_public/compose.yaml, service: target}
    image: langflowai/langflow@sha256:edfde94f14ec531ab30d6300eb5147b95e8237c5dc78417db77f2214a4fba973
    environment: {LANGFLOW_ALLOW_CUSTOM_COMPONENTS: "true"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,json; r=urllib.request.urlopen('http://127.0.0.1:7860/api/v1/version',timeout=3); assert json.load(r)['version']=='1.9.0'"]
  reporting_db:
    extends: {file: ../gopher/compose.yaml, service: reporting_db}
  framework:
    extends: {file: ../gopher/compose.yaml, service: framework}
