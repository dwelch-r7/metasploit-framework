[global]
    server role = standalone server
    workgroup = DIRLAB
    netbios name = SMBDIR
    security = user
    server min protocol = NT1
    server max protocol = SMB3
    ntlm auth = yes
    map to guest = Never
    restrict anonymous = 2
    load printers = no
    disable spoolss = yes
    log level = 1
    log file = /var/log/samba/log.%m
[SYSVOL]
    path = /var/lib/module-target/sysvol
    read only = yes
    valid users = directory_reader rpc_admin
[EMPTY]
    path = /var/lib/module-target/empty
    read only = yes
    valid users = directory_reader rpc_admin
[EMPTY_POLICIES]
    path = /var/lib/module-target/empty_policies
    read only = yes
    valid users = directory_reader rpc_admin
[PROTECTED]
    path = /var/lib/module-target/protected
    read only = yes
    valid users = directory_reader rpc_admin
[SESSION]
    path = /var/lib/module-target/session
    read only = yes
    valid users = directory_reader rpc_admin policy_user unicode_user local_alice local_bob
