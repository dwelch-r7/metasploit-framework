x-target: &target
  platform: linux/amd64
  init: true
  cpus: 0.1
  mem_limit: 64m
  memswap_limit: 64m
  pids_limit: 32
  networks: [default]
  ports:
    - {target: 11211, protocol: udp, host_ip: 127.0.0.1}
  healthcheck:
    test: [CMD-SHELL, "kill -0 1"]
    interval: 1s
    timeout: 2s
    retries: 30
services:
  legacy:
    <<: *target
    image: memcached:1.4.39@sha256:f4504742a8fb03c3ac0cd172e1c1d2277117629f8d21d52f78307121ddc3de5f
    command: [memcached, -m, '16', -t, '1', -U, '11211']
  modern:
    <<: *target
    image: memcached:1.6.26@sha256:09eaba8e0b136af2f1d8a4985b4fda74ce2793f95ea66d82fbe5769c05b42ea3
    command: [memcached, -m, '16', -t, '1', -U, '11211']
  disabled:
    <<: *target
    image: memcached:1.6.26@sha256:09eaba8e0b136af2f1d8a4985b4fda74ce2793f95ea66d82fbe5769c05b42ea3
    command: [memcached, -m, '16', -t, '1', -U, '0']
  framework:
    cpus: 1
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
networks:
  default: {internal: true}
