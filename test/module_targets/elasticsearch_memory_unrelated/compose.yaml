services:
  db:
    extends: {file: ../elasticsearch_memory/services.yaml, service: db}
  app:
    extends: {file: ../http/compose.yaml, service: apache}
    networks: [default, public]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    init: true
networks:
  default: {internal: true}
  public: {}
