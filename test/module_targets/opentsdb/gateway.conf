LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
ProxyPass /tsdb/ http://affected:4242/
ProxyPassReverse /tsdb/ http://affected:4242/

<Location /tsdb/>
  AuthType Basic
  AuthName "Module target"
  AuthUserFile /usr/local/apache2/conf/module-target.htpasswd
  Require valid-user
</Location>
