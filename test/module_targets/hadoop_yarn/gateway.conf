ServerName module-target-hadoop
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
ProxyRequests Off
ProxyPass /yarn/ http://resourcemanager:8088/
ProxyPassReverse /yarn/ http://resourcemanager:8088/
ProxyPass /secured/ http://resourcemanager:8088/
ProxyPassReverse /secured/ http://resourcemanager:8088/
ProxyPass /denied/ http://resourcemanager:8088/
ProxyPassReverse /denied/ http://resourcemanager:8088/
<Location /secured/>
    AuthType Basic
    AuthName "Module target Hadoop"
    AuthUserFile /tmp/module-target.htpasswd
    Require valid-user
</Location>
<Location /denied/>
    Require all denied
</Location>
