ServerName destination
Listen 443
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)
ProxyRequests Off
<VirtualHost *:80>
    ProxyPass /version http://modern:2375/version
    ProxyPassReverse /version http://modern:2375/version
    <Location /version>
        AuthType Basic
        AuthName "Public Docker lab fixture"
        AuthUserFile /tmp/module-target.htpasswd
        Require valid-user
    </Location>
</VirtualHost>
<VirtualHost *:443>
    SSLEngine On
    SSLCertificateFile /usr/local/apache2/conf/module-target.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/module-target.key
    ProxyPass /version http://modern:2375/version
    ProxyPassReverse /version http://modern:2375/version
</VirtualHost>
