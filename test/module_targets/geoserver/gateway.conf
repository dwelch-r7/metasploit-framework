ServerName module-target-geoserver
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
ProxyRequests Off
ProxyPass /app/ http://app:8080/geoserver/
ProxyPassReverse /app/ http://app:8080/geoserver/
ProxyPass /prefix/geoserver/ http://app:8080/geoserver/
ProxyPassReverse /prefix/geoserver/ http://app:8080/geoserver/
ProxyPass /auth/geoserver/ http://app:8080/geoserver/
ProxyPassReverse /auth/geoserver/ http://app:8080/geoserver/
<Location /auth/>
    AuthType Basic
    AuthName "GeoServer native frontend"
    AuthUserFile /tmp/module-users
    Require valid-user
</Location>
Alias /unrelated/ /usr/local/apache2/htdocs/
<Directory /usr/local/apache2/htdocs>
    Require all granted
    FallbackResource /unrelated/index.html
</Directory>
