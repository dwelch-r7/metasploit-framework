services:
  app:
    image: docker.osgeo.org/geoserver:2.25.1@sha256:c210398100dcefdb3de3a7ebe7d1c5068aa92ce6e490aebdeaa3c51a79c1eb57
    platform: linux/amd64
    init: true
    cpus: 0.9
    mem_limit: 1024m
    environment:
      EXTRA_JAVA_OPTS: -Xms128m -Xmx512m -XX:ActiveProcessorCount=1
      INSTALL_EXTENSIONS: 'false'
    volumes: [geoserver_data:/opt/geoserver_data]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/geoserver/web/ >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 40
  gateway:
    extends: {file: ../druid/compose.yaml, service: gateway}
    cpus: 0.1
    volumes: [./gateway.conf:/usr/local/apache2/conf/extra/druid.conf:ro]
    command: [/bin/sh, -c, "htpasswd -bc /tmp/module-users admin geoserver && exec httpd-foreground -c 'Include conf/extra/druid.conf'"]
  framework:
    extends: {file: ../framework.compose.yaml, service: framework}
    cpus: 1
    mem_limit: 768m
networks:
  default: {internal: true}
  public:
volumes:
  geoserver_data:
