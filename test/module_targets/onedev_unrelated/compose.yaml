services:
  target:
    image: httpd:2.4.62@sha256:4c7788695c832bf415a662dfb5160f1895e65fc65c025e85f436ee2c9e7d7f3e
    cpus: 0.1
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 128
    ports: ["127.0.0.1::80"]
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/80 && printf "GET / HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && IFS= read -r status <&3 && [[ "$$status" == *" 200 "* ]]']
      interval: 2s
      timeout: 3s
      retries: 30
  framework:
    cpus: 1
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
