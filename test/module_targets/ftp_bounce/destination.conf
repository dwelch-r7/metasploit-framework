ServerName module-target-ftp-bounce-destination
Listen 8080
Listen 8082
<IfModule mpm_event_module>
  StartServers 1
  ServerLimit 1
  ThreadLimit 8
  ThreadsPerChild 8
  MinSpareThreads 2
  MaxSpareThreads 8
  MaxRequestWorkers 8
</IfModule>
LogFormat "MODULE_TARGET_BOUNCE %a %{local}p \"%r\" %>s" bounce
CustomLog /proc/self/fd/1 bounce
