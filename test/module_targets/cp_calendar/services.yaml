services:
  db:
    extends: {file: ../wordpress/compose.yaml, service: db}
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    init: true
    networks: [default]
  app:
    extends: {file: ../wordpress/compose.yaml, service: root}
    environment:
      CP_CALENDAR_RELEASE: "1.1.4"
      CP_CALENDAR_MODE: "enabled"
    volumes:
    - ../wordpress/seed.php:/opt/module-target/seed-base.php:ro
    - ./apache2-foreground:/usr/local/bin/apache2-foreground:ro
    - ./seed.php:/opt/module-target/seed.php:ro
    - ./control.php:/opt/module-target/control.php:ro
    - ./releases.json:/opt/module-target/releases.json:ro
    - ../wpdiscuz/no-mail.ini:/usr/local/etc/php/conf.d/module-target-cp-calendar.ini:ro
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    init: true
    networks: [default, public]
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/module-target-cp-calendar-ready && curl --fail --silent http://127.0.0.1$${LAB_PREFIX}/wp-login.php >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 50
  reporting_db:
    extends: {file: ../elasticsearch_memory/services.yaml, service: db}
