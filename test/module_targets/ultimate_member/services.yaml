services:
  db:
    extends: {file: ../cp_calendar/services.yaml, service: db}
  app:
    extends: {file: ../wordpress/compose.yaml, service: root}
    environment:
      ULTIMATE_MEMBER_RELEASE: "2.8.2"
      ULTIMATE_MEMBER_MODE: "enabled"
      ULTIMATE_MEMBER_DIRECTORY_ROLES: "all"
      ULTIMATE_MEMBER_CUSTOM_META: "1"
    volumes:
    - ../wordpress/seed.php:/opt/module-target/seed-base.php:ro
    - ./apache2-foreground:/usr/local/bin/apache2-foreground:ro
    - ./seed.php:/opt/module-target/seed.php:ro
    - ./setup.php:/opt/module-target/setup.php:ro
    - ./migrate.php:/opt/module-target/migrate.php:ro
    - ./finish.php:/opt/module-target/finish.php:ro
    - ./control.php:/opt/module-target/control.php:ro
    - ./releases.json:/opt/module-target/releases.json:ro
    - ./php.ini:/usr/local/etc/php/conf.d/module-target-ultimate-member.ini:ro
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    init: true
    networks: [default, public]
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/module-target-ultimate-member-ready && curl --fail --silent http://127.0.0.1$${LAB_PREFIX}/wp-login.php >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 50
  reporting_db:
    extends: {file: ../elasticsearch_memory/services.yaml, service: db}
