services:
  target:
    image: eclipse-temurin@sha256:c6bac7c75823864b6317e0ed70e5ac1ec15e65180b4c4ccf09ca2ebf8a8f5f99
    platform: linux/amd64
    init: true
    read_only: true
    user: '1000:1000'
    cpus: 0.8
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    entrypoint: [/bin/sh, /fixture/start.sh]
    environment:
      SPRINGCLOUD_LOCATION: file:./
    volumes:
    - '${MODULE_TARGET_ROOT}/test/module_targets/springcloud_config:/fixture:ro'
    - '${MODULE_TARGET_ROOT}/test/module_targets/springcloud_config/fixture:/lab:ro'
    - '${MODULE_TARGET_ROOT}/tmp/module-target-springcloud-artifacts/proof/binary.bin:/lab/proof/binary.bin:ro'
    - '${MODULE_TARGET_ROOT}/test/module_targets/springcloud_config/fixture/proof/root.txt:/springcloud-proof.txt:ro'
    ports: ['127.0.0.1::8888']
    tmpfs: ['/tmp:rw,size=128m,mode=1777']
    healthcheck:
      test: [CMD, /bin/bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/8888; printf "GET /foo/development HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -n1 <&3 | grep -q " 200 "']
      interval: 3s
      timeout: 5s
      retries: 40
