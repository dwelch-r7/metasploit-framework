---
services:
  target:
    extends:
      file: "../dolibarr/compose.yaml"
      service: target
    environment:
      DOLIBARR_PREFIX: "/crm"
      DOLIBARR_LOOKUP_ENABLE: 'false'
    volumes:
    - "${MODULE_TARGET_ROOT}/tmp/module-target-dolibarr-sources/16.0.4/source:/opt/dolibarr:ro"
  database:
    extends:
      file: "../dolibarr/compose.yaml"
      service: database
  framework:
    cpus: 1.0
    mem_limit: 640m
    memswap_limit: 640m
    pids_limit: 256
