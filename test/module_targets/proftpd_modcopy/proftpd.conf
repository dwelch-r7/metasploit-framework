ServerName "Module target ProFTPD"
ServerType standalone
DefaultServer on
ServerIdent on
Port 2121
UseIPv6 off
UseReverseDNS off
IdentLookups off
RequireValidShell off
AuthOrder mod_auth_file.c
AuthUserFile /etc/proftpd/users
AuthGroupFile /etc/proftpd/groups
User www-data
Group www-data
AllowOverwrite on
DelayEngine off
WtmpLog off
TransferLog NONE
SystemLog /run/proftpd.log
PidFile /run/proftpd.pid
ScoreboardFile /run/proftpd.scoreboard
<Directory /tmp/copy>
  <Limit WRITE>
    AllowAll
  </Limit>
</Directory>
<Directory /var/www/html/lab>
  <Limit WRITE>
    AllowAll
  </Limit>
</Directory>
