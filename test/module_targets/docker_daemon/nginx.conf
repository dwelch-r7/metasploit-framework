user www-data;
worker_processes 1;
daemon off;
pid /run/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 64; }
http {
  access_log /dev/stdout combined;
  client_max_body_size 4m;
  proxy_http_version 1.1;
  proxy_read_timeout 40s;
  server {
    listen 8080;
    location / { proxy_pass http://127.0.0.1:2375; }
  }
  server {
    listen 8081;
    auth_basic "Module target Docker API";
    auth_basic_user_file /etc/nginx/module-target.htpasswd;
    location / { proxy_pass http://127.0.0.1:2375; }
  }
  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/module-target.crt;
    ssl_certificate_key /etc/nginx/module-target.key;
    auth_basic "Module target Docker API TLS";
    auth_basic_user_file /etc/nginx/module-target.htpasswd;
    location / { proxy_pass http://127.0.0.1:2375; }
  }
}
