{
  "services": {
    "db": {
      "extends": {
        "file": "../ti_wishlist/services.yaml",
        "service": "db"
      }
    },
    "app": {
      "extends": {
        "file": "../ti_wishlist/services.yaml",
        "service": "app"
      },
      "environment": {
        "TI_WISHLIST_RELEASE": "2.8.2",
        "TI_WISHLIST_MODE": "enabled",
        "LAB_PLAIN": "1"
      },
      "volumes": [
        "../../../tmp/module-target-ti-wishlist-sources/2.8.2.zip:/opt/module-target/wishlist.zip:ro"
      ]
    },
    "reporting_db": {
      "extends": {
        "file": "../ti_wishlist/services.yaml",
        "service": "reporting_db"
      }
    }
  },
  "networks": {
    "default": {
      "internal": true
    },
    "public": {}
  }
}
