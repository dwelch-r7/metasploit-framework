---
services:
  db:
    extends: {file: ../gimedia/services.yaml, service: db}
  app:
    extends: {file: ../gimedia/services.yaml, service: root}
    environment:
      GIMEDIA_RELEASE: "3.0"
    volumes:
    - ../../../tmp/module-target-gimedia-sources/3.0.zip:/opt/module-target/plugin.zip:ro
networks:
  default: {internal: true}
  public: {}
