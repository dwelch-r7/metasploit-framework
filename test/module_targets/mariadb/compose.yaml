services:
  mysql:
    image: mariadb:11.2.2@sha256:c5077bb44d13a3f34dadb5a15861149e29b3251d1e24036d2dad9611dc9d940b
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_ROOT_HOST: "%"
    ports: ["127.0.0.1::3306"]
    healthcheck:
      test: [CMD-SHELL, "mariadb --host=127.0.0.1 --user=root --password=password --batch --skip-column-names --execute='SELECT CURRENT_USER()' | grep -q '^root@'"]
      interval: 1s
      timeout: 3s
      retries: 90
