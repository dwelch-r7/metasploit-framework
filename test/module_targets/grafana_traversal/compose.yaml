x-environment: &environment
  GF_ANALYTICS_REPORTING_ENABLED: 'false'
  GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
  GF_LOG_LEVEL: warn
  GF_SECURITY_ADMIN_USER: module-lab-admin
  GF_SECURITY_ADMIN_PASSWORD: module-target-grafana-password

x-grafana: &grafana
  environment: *environment
  ports: ["127.0.0.1::3000"]
  volumes:
    - ./proof.txt:/etc/grafana/module-target-proof.txt:ro
  mem_limit: 256m
  healthcheck:
    test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
    interval: 2s
    timeout: 4s
    retries: 45

