services:
  db:
    extends: {file: ../wordpress/compose.yaml, service: db}
    platform: linux/amd64
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    init: true
    volumes: [database:/var/lib/mysql]
    networks: [default]
  app:
    extends: {file: ../wordpress/compose.yaml, service: root}
    platform: linux/amd64
    environment:
      BACKUP_MIGRATION_RELEASE: '1.3.7'
    volumes:
      - wordpress:/var/www/html
      - ../wordpress/seed.php:/opt/module-target/seed-base.php:ro
      - ./apache2-foreground:/usr/local/bin/apache2-foreground:ro
      - ./seed.php:/opt/module-target/seed.php:ro
      - ./releases.json:/opt/module-target/releases.json:ro
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    init: true
    networks:
      default: {aliases: [module-target.test]}
      public: {aliases: [module-target.test]}
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/module-target-backup-migration-ready && curl --fail --silent http://127.0.0.1$${LAB_PREFIX}/wp-login.php >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 50
