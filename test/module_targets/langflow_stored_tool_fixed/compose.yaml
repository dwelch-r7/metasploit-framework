services:
  target:
    extends: {file: ../langflow_public/compose.yaml, service: target}
    image: langflowai/langflow@sha256:0a496cd7f76f765e53611da90c565039e3413c93940f4d403039c5d8e7f80c6a
    environment: {LANGFLOW_ALLOW_CUSTOM_COMPONENTS: "true", LANGFLOW_RATE_LIMIT_PER_MINUTE: "100"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,json; r=urllib.request.urlopen('http://127.0.0.1:7860/api/v1/version',timeout=3); assert json.load(r)['version']=='1.10.0'"]
  reporting_db:
    extends: {file: ../gopher/compose.yaml, service: reporting_db}
  framework:
    extends: {file: ../gopher/compose.yaml, service: framework}
