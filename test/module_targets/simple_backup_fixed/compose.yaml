    extends: {file: ../simple_backup/services.yaml, service: db}
  app:
    extends: {file: ../simple_backup/services.yaml, service: root}
    environment:
      SIMPLE_BACKUP_RELEASE: "2.7.11"
    volumes:
    - ../../../tmp/module-target-simple-backup-sources/2.7.11.zip:/opt/module-target/plugin.zip:ro
networks:
  default: {internal: true}
  public: {}
