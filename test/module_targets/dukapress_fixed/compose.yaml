---
services:
  db:
    extends: {file: ../dukapress/services.yaml, service: db}
  app:
    extends: {file: ../dukapress/services.yaml, service: root}
    environment:
      DUKAPRESS_RELEASE: "2.5.4"
    volumes:
    - ../../../tmp/module-target-dukapress-sources/2.5.4.zip:/opt/module-target/plugin.zip:ro
networks:
  default: {internal: true}
  public: {}
