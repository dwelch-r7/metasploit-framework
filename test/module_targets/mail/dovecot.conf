protocols = imap pop3
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
mail_location = maildir:~/Maildir
ssl = yes
ssl_cert = </etc/dovecot/certificates/server.crt
ssl_key = </etc/dovecot/certificates/server.key
disable_plaintext_auth = no
auth_mechanisms = plain login
auth_failure_delay = 0
auth_username_format = %u
passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
