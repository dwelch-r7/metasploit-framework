---
services:
  db:
    extends: {file: ../bookingpress/services.yaml, service: db}
  app:
    extends: {file: ../bookingpress/services.yaml, service: prefix}
    environment:
      BOOKINGPRESS_RELEASE: "1.0.10"
      BOOKINGPRESS_MODE: affected
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
    - ../../../tmp/module-target-bookingpress-sources/1.0.10.zip:/opt/module-target/plugin.zip:ro
  reporting_db:
    extends: {file: ../bookingpress/services.yaml, service: reporting_db}
networks:
  default: {internal: true}
  public: {}
