services:
  db:
    extends: {file: ../wordpress/compose.yaml, service: db}
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    init: true
    networks: [default]
  app:
    extends: {file: ../wordpress/compose.yaml, service: root}
    environment:
      KING_RELEASE: '51.1.14'
    volumes:
    - ../wordpress/seed.php:/opt/module-target/seed-base.php:ro
    - ./apache2-foreground:/usr/local/bin/apache2-foreground:ro
    - ./seed.php:/opt/module-target/seed.php:ro
    - ./activate.php:/opt/module-target/activate.php:ro
    - ./configure.php:/opt/module-target/configure.php:ro
    - ./control.php:/opt/module-target/control.php:ro
    - ./probe-plugin.php:/opt/module-target/probe-plugin.php:ro
    - ./php.ini:/usr/local/etc/php/conf.d/module-target-king.ini:ro
    - ./releases.json:/opt/module-target/releases.json:ro
    - ../elementor/releases.json:/opt/module-target/elementor-releases.json:ro
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    init: true
    networks:
      default: {aliases: [module-target.test]}
      public: {aliases: [module-target.test]}
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/module-target-king-ready && curl --fail --silent "http://127.0.0.1$$(cat /tmp/module-target-king-widget-route)" >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 70
  reporting_db:
    extends: {file: ../elasticsearch_memory/services.yaml, service: db}
