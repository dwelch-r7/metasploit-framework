ServerName module-target-webdav.test
ServerTokens Full
DavLockDB /usr/local/apache2/var/DavLock

<Directory "/usr/local/apache2/htdocs/dav">
    Dav On
    Require all granted
</Directory>
<Directory "/usr/local/apache2/htdocs/auth">
    Dav On
    AuthType Basic
    AuthName "Module target WebDAV"
    AuthUserFile "/usr/local/apache2/conf/module-target-webdav.htpasswd"
    Require valid-user
</Directory>
<Directory "/usr/local/apache2/htdocs/readonly">
    Dav On
    Require method GET HEAD OPTIONS PROPFIND
</Directory>
