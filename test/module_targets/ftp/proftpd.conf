ServerName "Module target FTP"
ServerType standalone
DefaultServer on
Port 21
UseIPv6 off
UseReverseDNS off
RequireValidShell off
AuthOrder mod_auth_unix.c
User nobody
Group nogroup
DefaultRoot /srv/ftp
AllowOverwrite on
DelayEngine off
WtmpLog off
TransferLog NONE
<Directory /srv/ftp>
  <Limit WRITE>
    AllowAll
  </Limit>
</Directory>
<Anonymous /srv/ftp>
  User ftp
  Group nogroup
  UserAlias anonymous ftp
  RequireValidShell off
  <Limit LOGIN>
    ANONYMOUS_LOGIN
  </Limit>
  <Limit WRITE>
    ANONYMOUS_WRITE
  </Limit>
</Anonymous>
