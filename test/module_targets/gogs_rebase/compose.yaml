x-gogs: &gogs
  build: ../gogs
  platform: linux/amd64
  init: true
  mem_limit: 256m
  cpus: 0.5
  cap_drop: [SYS_ADMIN, SYS_TIME]
  environment: &gogs_env
    PUID: '1000'
    PGID: '1000'
    SOCAT_LINK: 'false'
    RUN_CROND: 'false'
    GOMAXPROCS: '1'
  healthcheck:
    test: [CMD-SHELL, 'curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null']
    interval: 2s
    timeout: 3s
    retries: 45

services:
  gogs:
    <<: *gogs
    build:
      context: ../gogs
      args: {GOGS_IMAGE: 'gogs/gogs:0.14.2@sha256:c8a080c3ddd753436c5671f004536ef9fd84f52e17e1c4467e3de1d43e1073b3'}
    hostname: gogs
    ports: ['127.0.0.1::3000']
    environment:
      <<: *gogs_env
      GOGS_LAB_VERSION: '0.14.2'
      GOGS_LAB_HOST: gogs
      GOGS_LAB_EXTERNAL_URL: http://gogs:3000/
    volumes: [gogs_data:/data, gogs_backup:/backup]
    networks:
      default:
        aliases: [gogs]
  prefixed:
    <<: *gogs
    build:
      context: ../gogs
      args: {GOGS_IMAGE: 'gogs/gogs:0.14.2@sha256:c8a080c3ddd753436c5671f004536ef9fd84f52e17e1c4467e3de1d43e1073b3'}
    hostname: prefixed
    ports: []
    environment:
      <<: *gogs_env
      GOGS_LAB_VERSION: '0.14.2'
      GOGS_LAB_HOST: prefixed
      GOGS_LAB_EXTERNAL_URL: http://gateway/gogs/
    volumes: [prefixed_data:/data, prefixed_backup:/backup]
    networks:
      default:
        aliases: [gogs-prefix]
  gateway:
    image: httpd:2.4.62@sha256:4c7788695c832bf415a662dfb5160f1895e65fc65c025e85f436ee2c9e7d7f3e
    mem_limit: 64m
    cpus: 0.2
    ports: ['127.0.0.1::80']
    volumes: ['../gogs/gateway.conf:/usr/local/apache2/conf/extra/gogs.conf:ro']
    command: [httpd-foreground, -c, 'Include conf/extra/gogs.conf']
    healthcheck:
      test: [CMD, httpd, -t, -c, 'Include conf/extra/gogs.conf']
      interval: 2s
      timeout: 3s
      retries: 30
  framework:
    init: true
    mem_limit: 1024m
    cpus: 1.0
  reporting_db:
    extends: {file: ../credential_reporting/compose.yaml, service: reporting_db}
    mem_limit: 128m
    cpus: 0.25
volumes:
  gogs_data: {}
  gogs_backup: {}
  prefixed_data: {}
  prefixed_backup: {}
